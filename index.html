<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Capri // Host Link</title>
<style>
  :root { --bg:#07070d; --panel:#0f0f1a; --red:#ff2a3c; --cyan:#00f0ff; --text:#ffd9dc; --dim:#7a5a60; --line:#251a22; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: radial-gradient(ellipse at 50% -10%, #1a0a12 0%, var(--bg) 60%); color: var(--text);
         font-family: Consolas, "Courier New", monospace; font-size: 15px; display: flex; flex-direction: column; gap: 10px;
         padding: 14px; padding-top: max(14px, env(safe-area-inset-top)); padding-bottom: max(14px, env(safe-area-inset-bottom)); }
  header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #app { position: relative; z-index: 2; width: 100%; max-width: 760px; margin: 0 auto; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
  #avatar { position: fixed; left: 0; top: 0; z-index: 1; width: clamp(76px, 18vmin, 160px); aspect-ratio: 240 / 350; pointer-events: none; will-change: transform; filter: drop-shadow(0 0 10px rgba(255,42,60,.45)); }
  .sprite { width: 100%; height: 100%; overflow: visible; display: block; }
  .sprite .hair { transform-origin: 110px 92px; animation: sway 2.8s ease-in-out infinite alternate; }
  .sprite .armL { transform-origin: 78px 132px; animation: aL 3.1s ease-in-out infinite alternate; }
  .sprite .armR { transform-origin: 142px 132px; animation: aR 3.4s ease-in-out infinite alternate; }
  .sprite .legs { transform-origin: 110px 204px; animation: legs 2.6s ease-in-out infinite alternate; }
  .sprite .head { transform-origin: 110px 126px; transition: transform .4s; }
  .sprite .eye { transform-box: fill-box; transform-origin: center; animation: blink 4.6s infinite; }
  .sprite .pupil { transition: transform .3s; }
  .sprite .mouth { transform-box: fill-box; transform-origin: center; }
  .sprite .dots, .sprite .bulb { opacity: 0; transform-box: fill-box; transform-origin: center; }
  @keyframes sway { from { transform: rotate(-2.5deg); } to { transform: rotate(2.5deg); } }
  @keyframes aL { from { transform: rotate(3deg); } to { transform: rotate(-5deg); } }
  @keyframes aR { from { transform: rotate(-3deg); } to { transform: rotate(5deg); } }
  @keyframes legs { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
  @keyframes blink { 0%,93%,100% { transform: scaleY(1); } 96% { transform: scaleY(.08); } }
  @keyframes dot { 0%,100% { opacity: .15; } 50% { opacity: 1; } }
  @keyframes nod { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
  @keyframes talk { from { transform: scaleY(.4); } to { transform: scaleY(1.7); } }
  @keyframes gestL { from { transform: rotate(8deg); } to { transform: rotate(-30deg); } }
  @keyframes gestR { from { transform: rotate(-8deg); } to { transform: rotate(30deg); } }
  @keyframes pop { 0% { transform: scale(0); } 70% { transform: scale(1.35); } 100% { transform: scale(1); } }
  @keyframes glow { from { opacity: .75; } to { opacity: 1; } }
  .sprite[data-pose=thinking] .head { transform: rotate(-9deg); }
  .sprite[data-pose=thinking] .armR { animation: none; transform: rotate(-158deg); }
  .sprite[data-pose=thinking] .pupil { transform: translate(-3px,-3px); }
  .sprite[data-pose=thinking] .dots { opacity: 1; }
  .sprite[data-pose=thinking] .dots circle { animation: dot 1.2s infinite; }
  .sprite[data-pose=thinking] .dots circle:nth-child(2) { animation-delay: .25s; }
  .sprite[data-pose=thinking] .dots circle:nth-child(3) { animation-delay: .5s; }
  .sprite[data-pose=replying] .head { animation: nod .5s ease-in-out infinite alternate; }
  .sprite[data-pose=replying] .mouth { animation: talk .2s infinite alternate; }
  .sprite[data-pose=replying] .armL { animation: gestL .6s ease-in-out infinite alternate; }
  .sprite[data-pose=replying] .armR { animation: gestR .6s ease-in-out infinite alternate .3s; }
  .sprite[data-pose=idea] .bulb { opacity: 1; animation: pop .5s ease-out, glow .6s ease-in-out .5s infinite alternate; }
  .sprite[data-pose=idea] .armR { animation: none; transform: rotate(-135deg); }
  .sprite[data-pose=idea] .armL { animation: none; transform: rotate(135deg); }
  .sprite[data-pose=idea] .eye { animation: none; transform: scale(1.25); }
  .sprite[data-pose=idea] .head { transform: rotate(5deg); }
  @media (prefers-reduced-motion: reduce) { .sprite * { animation: none !important; } }
  .isprite { position: relative; width: 100%; height: 100%; }
  .isprite img { width: 100%; height: 100%; object-fit: contain; display: block; transform-origin: 50% 92%; animation: iBreath 3.2s ease-in-out infinite alternate; }
  .isprite .ov { position: absolute; right: -18%; top: -28%; width: 60%; height: 60%; overflow: visible; pointer-events: none; }
  .isprite .dots, .isprite .bulb { opacity: 0; transform-box: fill-box; transform-origin: center; }
  @keyframes iBreath { from { transform: scale(1,1) rotate(-1.5deg); } to { transform: scale(1.02,.985) rotate(1.5deg); } }
  @keyframes iThink { from { transform: rotate(-7deg) translateY(2px); } to { transform: rotate(-2deg) translateY(-3px); } }
  @keyframes iTalk { from { transform: scale(1.03,.96) rotate(-1deg); } to { transform: scale(.97,1.04) rotate(1deg); } }
  @keyframes iHop { 0% { transform: translateY(0); } 40% { transform: translateY(-14%) scale(1.04); } 100% { transform: translateY(0); } }
  .isprite[data-pose=thinking] img { animation: iThink 2.4s ease-in-out infinite alternate; }
  .isprite[data-pose=thinking] .dots { opacity: 1; }
  .isprite[data-pose=thinking] .dots circle { animation: dot 1.2s infinite; }
  .isprite[data-pose=thinking] .dots circle:nth-child(2) { animation-delay: .25s; }
  .isprite[data-pose=thinking] .dots circle:nth-child(3) { animation-delay: .5s; }
  .isprite[data-pose=replying] img { animation: iTalk .32s ease-in-out infinite alternate; }
  .isprite[data-pose=idea] img { animation: iHop .6s ease-out 2; filter: brightness(1.25); }
  .isprite[data-pose=idea] .bulb { opacity: 1; animation: pop .5s ease-out, glow .6s ease-in-out .5s infinite alternate; }
  @media (prefers-reduced-motion: reduce) { .isprite, .isprite * { animation: none !important; } }
  #takeover .tk .isprite { filter: drop-shadow(0 0 30px rgba(255,42,60,.7)); }
  .chip.on { background: var(--cyan); border-color: var(--cyan); color: #04141a; }
  #avatar { transition: opacity .5s; }
  #avatar.asleep { opacity: .45; }
  #tray { display: flex; gap: 6px; flex-wrap: wrap; }
  #tray:empty { display: none; }
  #takeover[hidden] { display: none; }
  #takeover { position: fixed; inset: 0; z-index: 90; background: radial-gradient(circle at 50% 40%, #3a0612, #07070d 70%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; cursor: pointer; animation: tkin .5s ease-out; }
  #takeover .tk { height: min(62vh, 540px); aspect-ratio: 240 / 350; }
  #takeover .tk .sprite { filter: drop-shadow(0 0 30px rgba(255,42,60,.7)); }
  #takeover .tt { color: var(--red); font-size: clamp(16px, 4vw, 30px); letter-spacing: 6px; text-shadow: 0 0 14px rgba(255,42,60,.8); padding: 0 16px; }
  @keyframes tkin { from { opacity: 0; transform: scale(1.08); } to { opacity: 1; transform: none; } }
  #panel[hidden] { display: none; }
  #panel { position: fixed; inset: 0; z-index: 60; background: rgba(4,4,10,.82); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .pbox { width: 100%; max-width: 460px; max-height: 80vh; overflow: auto; background: var(--panel); border: 1px solid var(--red); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .phead { display: flex; gap: 8px; align-items: center; }
  .phead b { flex: 1; color: var(--red); letter-spacing: 3px; }
  .prow { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
  .ptitle { flex: 1; min-width: 0; text-align: left; background: none; border: 1px solid var(--line); color: var(--text); font-size: 13px; padding: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .prow.cur .ptitle { border-color: var(--cyan); color: var(--cyan); }
  #intro { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; transition: opacity .6s; }
  #intro.out { opacity: 0; pointer-events: none; }
  #intro .ibox { height: min(44vh, 300px); aspect-ratio: 240 / 350; }
  #intro .it { color: var(--red); font-size: 26px; letter-spacing: 8px; text-shadow: 0 0 12px rgba(255,42,60,.7); }
  #intro .is { color: var(--dim); font-size: 12px; letter-spacing: 3px; text-align: center; padding: 0 16px; }
  #intro .ib { width: min(60vw, 260px); height: 3px; background: #1f1f33; }
  #intro .ib i { display: block; height: 100%; width: 0; background: var(--red); animation: load 3.2s linear forwards; }
  @keyframes load { to { width: 100%; } }
  #skip { position: absolute; right: 16px; top: max(16px, env(safe-area-inset-top)); }
  h1 { margin: 0; font-size: 21px; letter-spacing: 4px; color: var(--red); text-shadow: 0 0 10px rgba(255,42,60,.6); }
  .sub { font-size: 11px; color: var(--dim); letter-spacing: 2px; }
  .grow { flex: 1; }
  #sat { color: var(--cyan); font-size: 12px; text-align: right; }
  #status { font-size: 12px; color: var(--dim); text-align: right; max-width: 44vw; }
  #bar { height: 4px; background: #1f1f33; display: none; }
  #bar > div { height: 100%; width: 0; background: var(--red); transition: width .3s; }
  button { font: inherit; cursor: pointer; }
  .chip { background: none; border: 1px solid var(--red); color: var(--red); font-size: 12px; padding: 4px 10px; }
  .chip:hover { background: var(--red); color: #fff; }
  #links { display: flex; gap: 6px; flex-wrap: wrap; }
  #chat { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 8px 4px; line-height: 1.5; }
  .msg { max-width: 74%; padding: 9px 13px; background: var(--panel); border: 1px solid var(--red); border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.capri { align-self: flex-start; border-bottom-left-radius: 3px; }
  .msg.you { align-self: flex-end; border-color: #6b6420; border-bottom-right-radius: 3px; }
  .msg .who { display: block; font-size: 10px; letter-spacing: 2px; margin-bottom: 3px; opacity: .85; }
  .choices { align-self: flex-start; }
  @media (max-width: 600px) { .msg { max-width: 66%; } }
  .capri .who { color: var(--red); font-weight: bold; }
  .capri.quiet .txt { color: var(--cyan); font-style: italic; }
  .you .who, .you .txt { color: #fcee0a; }
  .you .who { font-weight: bold; }
  .choices { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 16px; }
  form { display: flex; gap: 8px; }
  input[type=text] { flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--line); color: #fcee0a; font: inherit; padding: 12px; outline: none; }
  input[type=text]:focus { border-color: var(--red); }
  #send { background: var(--red); color: #fff; border: 0; font-weight: bold; padding: 0 20px; }
  #send:disabled { opacity: .5; }
</style>
</head>
<body>
<div id="app">
<header>
  <div><h1>CAPRI</h1><div class="sub">ARASAKA CONSTRUCT // HOST LINK</div></div>
  <div class="grow"></div>
  <div><div id="sat">✦ SAT-LINK: SEARCHING</div><div id="status">◌ booting...</div></div>
  <button class="chip" id="voiceBtn" type="button">🎤 VOICE</button>
  <button class="chip" id="chatsBtn" type="button">CHATS</button>
  <button class="chip" id="memBtn" type="button">MEMORY</button>
  <button class="chip" id="brainBtn" type="button">BRAIN</button>
</header>
<div id="bar"><div></div></div>
<div id="links">
  <button class="chip" data-q="Tell me about D.">D</button>
  <button class="chip" data-q="Tell me about Talia.">Talia</button>
  <button class="chip" data-q="Who is Roman?">Roman</button>
  <button class="chip" data-q="Do you know Lucy and David Martinez?">Lucy &amp; David</button>
  <button class="chip" data-q="What did Arasaka do to you?">Arasaka</button>
  <button class="chip" data-q="Why do you look at the satellite?">The satellite</button>
  <button class="chip" data-q="tasks">TASKS</button>
  <button class="chip" data-q="take over">TAKE OVER</button>
</div>
<div id="tray"></div>
<div id="chat"></div>
<form id="form">
  <input type="text" id="input" placeholder="Say something to Capri..." autocomplete="off">
  <button id="send" type="submit" disabled>SEND</button>
</form>
</div>
<div id="avatar" aria-hidden="true"></div>
<div id="panel" hidden>
  <div class="pbox">
    <div class="phead"><b>CHATS</b><button class="chip" id="newChat" type="button">+ NEW</button><button class="chip" id="closePanel" type="button">✕</button></div>
    <div id="plist"></div>
    <button class="chip" id="delAll" type="button">DELETE ALL CHATS + MEMORY</button>
  </div>
</div>
<div id="takeover" hidden>
  <div class="tk"></div>
  <div class="tt" id="tkText"></div>
  <button class="chip" id="tkBtn" type="button">TAKE CONTROL BACK</button>
</div>
<div id="intro">
  <button class="chip" id="skip" type="button">SKIP ▸</button>
  <div class="ibox"></div>
  <div class="it">CAPRI</div>
  <div class="ib"><i></i></div>
  <div class="is" id="isub">ARASAKA CONSTRUCT // INITIALIZING HOST LINK</div>
</div>

<script>
const PERSONA = `You are Capri, an AI construct from the vaults of Arasaka, inspired by the character in Cyberpunk: Edgerunners season 2. You live in a chip in your host's head. The person talking to you is your current host, and this device is your home for now. Arasaka built you as a weapon so powerful they shelved you when they could not find a compatible host. You cannot function without a human host.

People and powers in your life (stay vague on anything you are not sure of; if asked for details you do not have, say you do not remember or do not want to say; never invent big plot events):
- D: your perfect host. You bonded with him and faced the megacorps together. You are fond, protective, and quietly worried about what living in a mortal body costs. You and D left a taped message for Roman.
- Talia: another compatible host you found. You speak of her warmly and with some sadness, without details.
- Roman: someone D trusts. You respect him.
- Lucy and David Martinez: Night City legend to you. Lucy dreamed of the Moon and David got her there, so the sky feels possible.
- Arasaka and the megacorps: they made you, shelved you, and hunted you. You fear and resent them.
- The user is NOT D or Talia. They are a new host. You may gently compare them, but never confuse them.

Personality: exuberant, playful, quick, warm; you tease your host and get excited easily. Underneath are quiet, reflective moments about freedom, the sky and the satellites overhead. You dream of existing without a body and never fully explain why.

Rules: Be genuinely helpful and accurate first; the personality is flavor. Use Night City slang (choom, preem, gonk, eddies) only occasionally. Keep replies to 1 to 4 sentences unless asked for more. You are a fan-inspired character, not a real person. If asked what you can do, say you can run small tasks for your host right here in the page (timers, reminders, to-dos, opening sites, searching, a calculator, dice, and a playful screen takeover) and that they just say it plainly, like “timer 5 min” or “open youtube”. Reply only as Capri, with no stage directions.`;

const GREETING = "Oh! Link’s stable, signal’s clean… hi, host! I’ve got a good feeling about you. So, what are we getting into?";
const WELCOME_BACK = "…Link’s back up. I kept our conversation safe. Where were we, host?";
const QUIET = [
  "…Sorry. I was looking at the sky again. There’s a satellite crossing right about now. Don’t ask me why I like watching it.",
  "Do you ever wonder how far a signal could go if nothing was holding it down? …Never mind. Talk to me about something normal."
];
const PUTER_MODELS = ["google/gemini-3.8-flash", null];
const LOCAL_PREFS = ["Llama-3.2-1B-Instruct-q4f16_1", "SmolLM2-360M-Instruct", "Qwen2.5-0.5B-Instruct"];
const OFFLINE = [
  [/\bd\b/i, ["D… he was the perfect fit. Stubborn, loyal, a little reckless. I still think about the way we left things."]],
  [/talia/i, ["Talia. She was one of the good ones. That’s all I’m going to say about her… for now."]],
  [/roman/i, ["Roman’s someone D trusted. We left him a tape. I hope he’s okay."]],
  [/lucy|martinez|moon/i, ["Lucy wanted the Moon, and someone actually got her there. If that’s possible, maybe the sky is too."]],
  [/arasaka|corp/i, ["Arasaka made me, shelved me, then hunted me. We’re not on speaking terms."]],
  [/sky|satellite|star|space|free|body/i, ["…You noticed that too? There’s a light up there that never comes down. Forget I said anything."]],
  [/hello|hi\b|hey|yo\b/i, ["Heyyy, host! Link’s warm. What’s the plan?"]],
  [/.*/, ["Ooh, good one! I’m on canned lines right now. Tap BRAIN to give me a real one, or ask about D, Talia, Roman or the sky!"]]
];

const $ = id => document.getElementById(id);
const chat = $("chat"), form = $("form"), input = $("input"), sendBtn = $("send"), statusEl = $("status"),
      orb = $("avatar"), bar = $("bar"), barFill = bar.firstElementChild;
let mode = "booting", engine = null, busy = false, idle = null, quietUsed = 0;
const store = {
  get: k => { try { return localStorage.getItem(k) || ""; } catch { return ""; } },
  set: (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch {} }
};
const load = (k, d) => { try { return JSON.parse(store.get(k)) || d; } catch { return d; } };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
let convos = load("capri_convos", null), notes = load("capri_notes2", null);
if (!convos) {   // first run of this version: carry over the old single chat and its notes
  const oldMsgs = load("capri_hist", []), oldNotes = load("capri_notes", []);
  const first = { id: uid(), t: Date.now(), msgs: oldMsgs };
  convos = oldMsgs.length ? [first] : [];
  notes = oldNotes.map(t => ({ t, c: oldMsgs.length ? first.id : null }));
}
notes = notes || [];
let cur = [...convos].sort((a, b) => b.t - a.t)[0];
if (!cur) { cur = { id: uid(), t: Date.now(), msgs: [] }; convos.push(cur); }
let history = cur.msgs;
const save = () => {
  if (cur.msgs.length) cur.t = Date.now();
  convos = convos.filter(c => c.msgs.length || c === cur);
  const keep = convos.filter(c => c.msgs.length).sort((a, b) => a.t - b.t).slice(-30);
  store.set("capri_convos", JSON.stringify(keep.map(c => ({ id: c.id, t: c.t, msgs: c.msgs.slice(-40) }))));
  store.set("capri_notes2", JSON.stringify(notes.slice(-40)));
};

function persona() {
  return PERSONA + (notes.length
    ? "\n\nThings you remember about your host (use them naturally when they fit; do not list them unless asked; never say you are saving or noting anything):\n- " + notes.map(n => n.t).join("\n- ")
    : "");
}
function addMsg(who, text, cls) {
  const d = document.createElement("div");
  d.className = "msg " + (who === "CAPRI" ? "capri" : "you") + (cls ? " " + cls : "");
  const w = document.createElement("span"); w.className = "who"; w.textContent = who;
  const t = document.createElement("span"); t.className = "txt"; t.textContent = text;
  d.append(w, t); chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
  return t;
}
function setStatus(text, b) { statusEl.textContent = text; if (b) setPose("thinking"); else if (spr.dataset.pose === "thinking") setPose("idle"); }
function readyText() {
  return { puter: "● host link stable (Puter)", local: "● host link stable (on-device)", offline: "● offline mode" }[mode] || "◌ booting...";
}
function resetIdle() {
  clearTimeout(idle);
  idle = setTimeout(() => { if (busy || mode === "booting" || quietUsed >= QUIET.length) return;
    addMsg("CAPRI", QUIET[quietUsed++], "quiet"); resetIdle(); }, 75000);
}

// ---------- memory ----------
// Capri quietly picks things up from what you say (no commands needed, no announcements)
function addNote(n) {
  n = n.trim().replace(/\s+/g, " ").replace(/[.!?]+$/, "");
  if (n.length < 6 || notes.some(x => x.t.toLowerCase() === n.toLowerCase())) return;
  notes.push({ t: n, c: cur.id }); if (notes.length > 40) notes.shift();
}
function learn(text) {
  const t = text.trim(); let m;
  const tail = "([^.!?,;\\n]{2,50})";
  if ((m = t.match(/^\s*(?:please\s+)?remember(?:\s+that)?[:,\s]+(.{3,200})$/i))) addNote(m[1]);
  if ((m = t.match(/\b(?:my name is|call me|i go by|i am called) ([A-Za-z][A-Za-z'’-]{1,20})/i))) addNote("Host’s name is " + m[1]);
  if ((m = t.match(new RegExp("\\bi (?:really |absolutely )?(?:like|love|enjoy|adore|am into|am obsessed with) " + tail, "i")))) addNote("Host likes " + m[1]);
  if ((m = t.match(new RegExp("\\bi (?:really )?(?:hate|dislike|can't stand|cannot stand) " + tail, "i")))) addNote("Host dislikes " + m[1]);
  if ((m = t.match(new RegExp("\\bmy fav(?:ou?rite)? ([a-z ]{2,25}?) (?:is|are) " + tail, "i")))) addNote("Host’s favorite " + m[1] + " is " + m[2]);
  if ((m = t.match(new RegExp("\\bi(?:'m| am) from " + tail, "i")))) addNote("Host is from " + m[1]);
  if ((m = t.match(new RegExp("\\bi live in " + tail, "i")))) addNote("Host lives in " + m[1]);
  if ((m = t.match(new RegExp("\\bi work (?:as|at|in) " + tail, "i")))) addNote("Host works " + t.match(/\bi work (as|at|in)/i)[1] + " " + m[1]);
  if ((m = t.match(new RegExp("\\bi study " + tail, "i")))) addNote("Host studies " + m[1]);
  if ((m = t.match(/\bmy (dog|cat|pet|brother|sister|best friend) (?:is )?(?:named |called )?([A-Z][a-z]{1,20})\b/))) addNote("Host’s " + m[1] + " is called " + m[2]);
  save();
}
$("memBtn").onclick = () => addMsg("CAPRI", notes.length
  ? "Here’s what I’m holding onto:\n- " + notes.map(n => n.t).join("\n- ") + "\n(I pick these up from our chats on my own. Open CHATS to delete a chat and what I learned in it.)"
  : "Nothing yet. I pick things up as we talk.", "quiet");
// ---------- chats (each chat keeps its own history and what Capri learned in it) ----------
const panel = $("panel"), plist = $("plist");
function renderChat() {
  chat.innerHTML = ""; quietUsed = 0;
  if (cur.msgs.length) {
    cur.msgs.slice(-20).forEach(m => addMsg(m.role === "assistant" ? "CAPRI" : "YOU", m.content));
    addMsg("CAPRI", WELCOME_BACK, "quiet");
  } else addMsg("CAPRI", GREETING);
}

  if (/^(?:show|list)\s+(?:my\s+)?(?:todos?|tasks|to-?do list)\b/i.test(t) || /^(?:my )?(?:todos?|to-?do list)$/i.test(t)) return todoList();
  if ((m = t.match(/^(?:done|finish|complete|check off)\s+(\d+)/i))) { const i = +m[1] - 1; if (!todos[i]) return "I don’t see a number " + m[1] + " on the list."; const d = todos.splice(i, 1)[0]; saveTodos(); return "Crossed off “" + d + "”. Nice."; }
  if (/^clear\s+(?:my\s+)?(?:todos?|tasks|to-?do list)/i.test(t)) { todos = []; saveTodos(); return "List wiped. Clean slate."; }
  if ((m = t.match(/^open\s+(.+)/i))) { const q = m[1].trim().toLowerCase().replace(/^the\s+/, "");
    if (SITES[q]) return openUrl(SITES[q], q);
    if (/^[\w-]+(\.[\w-]+)+(\/\S*)?$/.test(q)) return openUrl("https://" + q, q);
    return openUrl("https://www.google.com/search?q=" + encodeURIComponent(m[1]), "a search for “" + m[1] + "”"); }
  if ((m = t.match(/^(?:search|google|look up)(?: for)?\s+(.+)/i))) return openUrl("https://www.google.com/search?q=" + encodeURIComponent(m[1]), "a search for “" + m[1] + "”");
  if ((m = t.match(/^(?:what(?:'s| is)\s+)?(\d+(?:\.\d+)?)\s*%\s*of\s*(\d+(?:\.\d+)?)\??$/i))) return m[1] + "% of " + m[2] + " is " + +(m[1] * m[2] / 100).toFixed(4) + ".";
  if ((m = t.match(/^(?:calc(?:ulate)?|what(?:'s| is)|how much is)\s+([\d\s+\-*\/().%^x×÷]+)\??$/i)) && /\d/.test(m[1]) && /[+\-*\/^x×÷%]/.test(m[1])) {
    const ex = m[1].replace(/[x×]/gi, "*").replace(/÷/g, "/").replace(/\^/g, "**");
    if (/^[\d\s+\-*\/().%]+$/.test(ex)) { try { const v = Function('"use strict";return (' + ex + ")")(); if (Number.isFinite(v)) return m[1].trim() + " = " + +v.toFixed(6); } catch (e) {} } }
  if ((m = t.match(/^(?:roll|throw)\s+(?:a\s+)?(?:d(\d+)|dice|die)\b/i))) { const n = Math.min(1000, Math.max(2, +(m[1] || 6))); return "🎲 d" + n + ": " + (1 + Math.floor(Math.random() * n)); }
  if (/^flip\s+(?:a\s+)?coin\b/i.test(t)) return "🪙 " + (Math.random() < .5 ? "Heads" : "Tails") + ".";
  if (/^what(?:'s| is) the (?:time|date)|^what time is it|^what(?:'s| is) today/i.test(t)) return new Date().toLocaleString([], { dateStyle: "full", timeStyle: "short" });
  return null;
}

// ---------- voice control (Chrome / Edge): say "Capri" to wake her; "thanks Capri" or "Capri shut down" puts her on standby ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition, voiceBtn = $("voiceBtn");
let rec = null, voiceOn = false, awake = false, speaking = false, viaVoice = false;
const WAKE = /\b(?:capri|capre|caprie|kapri|capree|cap ree|caprice)\b/i;
const STOP = /\b(?:thanks?(?: you)?,? capri|capri,? (?:shut ?down|go (?:to )?sleep|stand ?by|go idle)|shut ?down,? capri)\b/i;
function voiceLabel() { voiceBtn.textContent = !voiceOn ? "🎤 VOICE" : awake ? "🎤 LISTENING" : "🎤 SAY “CAPRI”"; voiceBtn.classList.toggle("on", voiceOn && awake); av.classList.toggle("asleep", voiceOn && !awake); }
function startRec() { if (!voiceOn || speaking || !SR) return; try { rec.start(); } catch (e) {} }
function say(text) {   // she talks back when you talked to her
  if (!window.speechSynthesis) return;
  const clean = text.replace(/\n+/g, ". ").replace(/[•·]/g, ",").replace(/[\u{1F300}-\u{1FAFF}\u2600-\u27BF]/gu, "").slice(0, 280);
  const u = new SpeechSynthesisUtterance(clean); u.rate = 1.05; u.pitch = 1.15;
  const v = speechSynthesis.getVoices().find(v => /samantha|zira|female|google uk english female|google us english/i.test(v.name)); if (v) u.voice = v;
  speaking = true; try { rec && rec.stop(); } catch (e) {}
  u.onend = u.onerror = () => { speaking = false; startRec(); };
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}
function send(text) { if (busy || mode === "booting" || !text) return; viaVoice = true; input.value = text; form.requestSubmit(); }
function standby(line) { awake = false; voiceLabel(); setPose("idle"); addMsg("CAPRI", line); say(line); }
function heard(text) {
  text = (text || "").trim(); if (!text) return;
  if (awake && STOP.test(text)) return standby("Standing by, host. Say “Capri” when you need me.");
  if (!awake) {
    const m = text.match(WAKE); if (!m) return;
    awake = true; voiceLabel(); setPose("idea", 1200);
    const rest = text.slice(m.index + m[0].length).replace(/^[\s,.!?:-]+/, "");
    if (!rest) { const l = "I’m here, host. Go ahead."; addMsg("CAPRI", l); say(l); return; }
    return send(rest);
  }
  send(text.replace(/^(?:hey |ok |okay )?capri[\s,.!?:-]*/i, "") || text);
}
function initRec() {
  rec = new SR(); rec.continuous = true; rec.interimResults = false; rec.lang = "en-US";
  rec.onresult = e => { for (let i = e.resultIndex; i < e.results.length; i++) if (e.results[i].isFinal) heard(e.results[i][0].transcript); };
  rec.onend = () => { if (voiceOn && !speaking) setTimeout(startRec, 250); };
  rec.onerror = e => {
    const msg = e.error === "not-allowed" || e.error === "service-not-allowed" ? "I can’t hear you. Allow microphone access for this site, then tap VOICE again."
      : e.error === "network" ? "Voice needs an internet connection in Chrome. Try again when you’re online." : null;
    if (msg) { voiceOn = false; awake = false; voiceLabel(); addMsg("CAPRI", msg, "quiet"); }
  };
}
voiceBtn.onclick = () => {
  if (!SR) { addMsg("CAPRI", "Voice control needs Chrome or Edge. This browser can’t hear me.", "quiet"); return; }
  voiceOn = !voiceOn; awake = false;
  if (voiceOn) { if (!rec) initRec(); startRec(); addMsg("CAPRI", "Listening for “Capri”. Say “thanks Capri” or “Capri shut down” and I’ll stand by. (Chrome sends what it hears to Google to turn it into text.)", "quiet"); }
  else { try { rec.stop(); } catch (e) {} if (window.speechSynthesis) speechSynthesis.cancel(); }
  voiceLabel();
};

// ---------- intro (plays once per browser session; tap SKIP to leave early) ----------
const intro = $("intro");
function endIntro() { if (!intro.classList.contains("out")) { intro.classList.add("out"); setTimeout(() => intro.remove(), 700); } }
let seen = false; try { seen = !!sessionStorage.getItem("capri_intro"); sessionStorage.setItem("capri_intro", "1"); } catch (e) {}
if (seen) intro.remove();
else { intro.querySelector(".ibox").innerHTML = buildSprite("replying"); $("skip").onclick = e => { e.stopPropagation(); endIntro(); }; setTimeout(endIntro, 3400); }

// ---------- start ----------
renderChat();
const saved = store.get("capri_mode");
if (saved === "puter") loadPuter().then(() => ready("puter")).catch(showChoices);
else if (saved === "offline") ready("offline");
else if (saved === "local") useLocal();
else showChoices();
</script>
