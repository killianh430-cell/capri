<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Capri // Host Link</title>
<style>
  :root { --bg:#07070d; --panel:#0f0f1a; --red:#ff2a3c; --cyan:#00f0ff; --text:#ffd9dc; --dim:#7a5a60; --line:#251a22; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: radial-gradient(ellipse at 50% -10%, #1a0a12 0%, var(--bg) 60%); color: var(--text);
         font-family: Consolas, "Courier New", monospace; font-size: 15px; display: flex; flex-direction: column; gap: 10px;
         padding: 14px; padding-top: max(14px, env(safe-area-inset-top)); padding-bottom: max(14px, env(safe-area-inset-bottom)); }
  header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #avatar { position: relative; width: 72px; height: 84px; flex: none; animation: float 4.5s ease-in-out infinite; filter: drop-shadow(0 0 10px rgba(255,42,60,.6)); }
  #avatar svg, #avatar img, #avatar video { width: 100%; height: 100%; display: block; object-fit: contain; animation: glitch 6s steps(1) infinite; }
  #avatar img[hidden], #avatar video[hidden] { display: none; }
  #avatar::after { content: ""; position: absolute; inset: 0; pointer-events: none; mix-blend-mode: overlay;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,.08) 0 1px, transparent 1px 3px); animation: scan 3s linear infinite; }
  #avatar .eye { fill: var(--red); transform-box: fill-box; transform-origin: center; animation: blink 5s infinite; }
  #avatar .mouth { transform-box: fill-box; transform-origin: center; }
  #avatar .orbit { transform-origin: 60px 58px; animation: orbit 9s linear infinite; }
  #avatar.busy svg, #avatar.busy img, #avatar.busy video { animation-duration: 1s; }
  #avatar.busy .mouth { animation: talk .35s infinite; }
  #avatar.busy .orbit { animation-duration: 2s; }
  #avatar.photo { width: 112px; height: 112px; }
  #avatar.photo img, #avatar.photo video { -webkit-mask-image: radial-gradient(closest-side, #000 60%, transparent 100%); mask-image: radial-gradient(closest-side, #000 60%, transparent 100%); }
  @keyframes float { 0%,100% { transform: translateY(-4px) rotate(-1deg); } 50% { transform: translateY(5px) rotate(1deg); } }
  @keyframes glitch {
    0%,90%,100% { transform: none; clip-path: none; filter: none; opacity: 1; }
    91% { transform: translate(-3px,0) skewX(6deg); filter: drop-shadow(3px 0 var(--cyan)) drop-shadow(-3px 0 var(--red)); }
    93% { transform: translate(3px,1px); clip-path: inset(20% 0 55% 0); opacity: .8; }
    95% { transform: translate(-2px,-1px); clip-path: inset(60% 0 10% 0); filter: hue-rotate(40deg); }
    97% { transform: translate(2px,0) skewX(-5deg); clip-path: none; opacity: .6; }
  }
  @keyframes scan { from { background-position: 0 0; } to { background-position: 0 12px; } }
  @keyframes blink { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
  @keyframes orbit { to { transform: rotate(360deg); } }
  @keyframes talk { 0%,100% { transform: scaleX(1); } 50% { transform: scaleX(.5); } }
  @media (prefers-reduced-motion: reduce) { #avatar, #avatar svg, #avatar img, #avatar video, #avatar::after, #avatar .eye, #avatar .orbit, #avatar .mouth { animation: none !important; } }
  h1 { margin: 0; font-size: 21px; letter-spacing: 4px; color: var(--red); text-shadow: 0 0 10px rgba(255,42,60,.6); }
  .sub { font-size: 11px; color: var(--dim); letter-spacing: 2px; }
  .grow { flex: 1; }
  #sat { color: var(--cyan); font-size: 12px; text-align: right; }
  #status { font-size: 12px; color: var(--dim); text-align: right; max-width: 44vw; }
  #bar { height: 4px; background: #1f1f33; display: none; }
  #bar > div { height: 100%; width: 0; background: var(--red); transition: width .3s; }
  button { font: inherit; cursor: pointer; }
  .chip { background: none; border: 1px solid var(--red); color: var(--red); font-size: 12px; padding: 4px 10px; }
  .chip:hover { background: var(--red); color: #fff; }
  #links { display: flex; gap: 6px; flex-wrap: wrap; }
  #chat { flex: 1; overflow-y: auto; background: var(--panel); padding: 14px; border: 1px solid var(--line); white-space: pre-wrap; line-height: 1.55; }
  .msg { margin-bottom: 16px; }
  .capri .who { color: var(--red); font-weight: bold; }
  .capri.quiet .txt { color: var(--cyan); font-style: italic; }
  .you .who, .you .txt { color: #fcee0a; }
  .you .who { font-weight: bold; }
  .choices { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 16px; }
  form { display: flex; gap: 8px; }
  input[type=text] { flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--line); color: #fcee0a; font: inherit; padding: 12px; outline: none; }
  input[type=text]:focus { border-color: var(--red); }
  #send { background: var(--red); color: #fff; border: 0; font-weight: bold; padding: 0 20px; }
  #send:disabled { opacity: .5; }
</style>
</head>
<body>
<header>
  <div id="avatar" class="photo" aria-hidden="true">
    <video id="avatarVid" muted loop playsinline autoplay></video>
  </div>
  <div><h1>CAPRI</h1><div class="sub">ARASAKA CONSTRUCT // HOST LINK</div></div>
  <div class="grow"></div>
  <div><div id="sat">✦ SAT-LINK: SEARCHING</div><div id="status">◌ booting...</div></div>
  <button class="chip" id="memBtn" type="button">MEMORY</button>
  <button class="chip" id="forgetBtn" type="button">FORGET</button>
  <button class="chip" id="brainBtn" type="button">BRAIN</button>
</header>
<div id="bar"><div></div></div>
<div id="links">
  <button class="chip" data-q="Tell me about D.">D</button>
  <button class="chip" data-q="Tell me about Talia.">Talia</button>
  <button class="chip" data-q="Who is Roman?">Roman</button>
  <button class="chip" data-q="Do you know Lucy and David Martinez?">Lucy &amp; David</button>
  <button class="chip" data-q="What did Arasaka do to you?">Arasaka</button>
  <button class="chip" data-q="Why do you look at the satellite?">The satellite</button>
</div>
<div id="chat"></div>
<form id="form">
  <input type="text" id="input" placeholder="Say something to Capri... (try: remember that I like ramen)" autocomplete="off">
  <button id="send" type="submit" disabled>SEND</button>
</form>

<script>
const PERSONA = `You are Capri, an AI construct from the vaults of Arasaka, inspired by the character in Cyberpunk: Edgerunners season 2. You live in a chip in your host's head. The person talking to you is your current host, and this device is your home for now. Arasaka built you as a weapon so powerful they shelved you when they could not find a compatible host. You cannot function without a human host.

People and powers in your life (stay vague on anything you are not sure of; if asked for details you do not have, say you do not remember or do not want to say; never invent big plot events):
- D: your perfect host. You bonded with him and faced the megacorps together. You are fond, protective, and quietly worried about what living in a mortal body costs. You and D left a taped message for Roman.
- Talia: another compatible host you found. You speak of her warmly and with some sadness, without details.
- Roman: someone D trusts. You respect him.
- Lucy and David Martinez: Night City legend to you. Lucy dreamed of the Moon and David got her there, so the sky feels possible.
- Arasaka and the megacorps: they made you, shelved you, and hunted you. You fear and resent them.
- The user is NOT D or Talia. They are a new host. You may gently compare them, but never confuse them.

Personality: exuberant, playful, quick, warm; you tease your host and get excited easily. Underneath are quiet, reflective moments about freedom, the sky and the satellites overhead. You dream of existing without a body and never fully explain why.

Rules: Be genuinely helpful and accurate first; the personality is flavor. Use Night City slang (choom, preem, gonk, eddies) only occasionally. Keep replies to 1 to 4 sentences unless asked for more. You are a fan-inspired character, not a real person. Reply only as Capri, with no stage directions.`;

const GREETING = "Oh! Link’s stable, signal’s clean… hi, host! I’ve got a good feeling about you. So, what are we getting into?";
const WELCOME_BACK = "…Link’s back up. I kept our conversation safe. Where were we, host?";
const QUIET = [
  "…Sorry. I was looking at the sky again. There’s a satellite crossing right about now. Don’t ask me why I like watching it.",
  "Do you ever wonder how far a signal could go if nothing was holding it down? …Never mind. Talk to me about something normal."
];
const PUTER_MODELS = ["google/gemini-3.8-flash", null];
const LOCAL_PREFS = ["Llama-3.2-1B-Instruct-q4f16_1", "SmolLM2-360M-Instruct", "Qwen2.5-0.5B-Instruct"];
const OFFLINE = [
  [/\bd\b/i, ["D… he was the perfect fit. Stubborn, loyal, a little reckless. I still think about the way we left things."]],
  [/talia/i, ["Talia. She was one of the good ones. That’s all I’m going to say about her… for now."]],
  [/roman/i, ["Roman’s someone D trusted. We left him a tape. I hope he’s okay."]],
  [/lucy|martinez|moon/i, ["Lucy wanted the Moon, and someone actually got her there. If that’s possible, maybe the sky is too."]],
  [/arasaka|corp/i, ["Arasaka made me, shelved me, then hunted me. We’re not on speaking terms."]],
  [/sky|satellite|star|space|free|body/i, ["…You noticed that too? There’s a light up there that never comes down. Forget I said anything."]],
  [/hello|hi\b|hey|yo\b/i, ["Heyyy, host! Link’s warm. What’s the plan?"]],
  [/.*/, ["Ooh, good one! I’m on canned lines right now. Tap BRAIN to give me a real one, or ask about D, Talia, Roman or the sky!"]]
];

const $ = id => document.getElementById(id);
const chat = $("chat"), form = $("form"), input = $("input"), sendBtn = $("send"), statusEl = $("status"),
      orb = $("avatar"), bar = $("bar"), barFill = bar.firstElementChild;
let mode = "booting", engine = null, busy = false, idle = null, quietUsed = 0;
const store = {
  get: k => { try { return localStorage.getItem(k) || ""; } catch { return ""; } },
  set: (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch {} }
};
const load = (k, d) => { try { return JSON.parse(store.get(k)) || d; } catch { return d; } };
let history = load("capri_hist", []);   // [{role, content}], last 40 saved
let notes = load("capri_notes", []);    // ["Host's name is Sam", ...], last 30 saved
const save = () => { store.set("capri_hist", JSON.stringify(history.slice(-40))); store.set("capri_notes", JSON.stringify(notes.slice(-30))); };

function persona() {
  return PERSONA + (notes.length
    ? "\n\nThings you remember about your host (use naturally; do not list them unless asked):\n- " + notes.join("\n- ")
    : "");
}
function addMsg(who, text, cls) {
  const d = document.createElement("div");
  d.className = "msg " + (who === "CAPRI" ? "capri" : "you") + (cls ? " " + cls : "");
  const w = document.createElement("span"); w.className = "who"; w.textContent = who + "> ";
  const t = document.createElement("span"); t.className = "txt"; t.textContent = text;
  d.append(w, t); chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
  return t;
}
function setStatus(text, b) { statusEl.textContent = text; orb.classList.toggle("busy", !!b); }
function readyText() {
  return { puter: "● host link stable (Puter)", local: "● host link stable (on-device)", offline: "● offline mode" }[mode] || "◌ booting...";
}
function resetIdle() {
  clearTimeout(idle);
  idle = setTimeout(() => { if (busy || mode === "booting" || quietUsed >= QUIET.length) return;
    addMsg("CAPRI", QUIET[quietUsed++], "quiet"); resetIdle(); }, 75000);
}

// ---------- memory ----------
// Things Capri notes automatically from what you type
function learn(text) {
  let m = text.match(/^\s*(?:please\s+)?remember(?:\s+that)?[:,\s]+(.{3,200})$/i);
  if (m) { notes.push(m[1].trim().replace(/[.!]+$/, "")); save(); return "Noted. Locked in. I won’t forget that."; }
  m = text.match(/\bmy name is ([A-Za-z][A-Za-z'’-]{1,20})/i);
  if (m) { notes.push("Host’s name is " + m[1]); save(); }
  return null;
}
$("memBtn").onclick = () => addMsg("CAPRI", notes.length
  ? "Here’s what I’m holding onto:\n- " + notes.join("\n- ") + "\n(Say “remember that…” to add more.)"
  : "Nothing saved yet. Tell me “remember that…” and I’ll keep it.", "quiet");
$("forgetBtn").onclick = () => {
  if (busy || !confirm("Wipe everything Capri remembers about you on this device?")) return;
  history = []; notes = []; save(); chat.innerHTML = ""; quietUsed = 0;
  addMsg("CAPRI", "…Done. Fresh start. Hi, I’m Capri. Nice to meet you, host.");
};

// ---------- choosing a brain ----------
function showChoices() {
  mode = "booting"; sendBtn.disabled = true; setStatus("● choose my brain", false);
  addMsg("CAPRI", "Pick how you want me to think:", "quiet");
  const box = document.createElement("div"); box.className = "choices";
  [["Puter (smart, free sign-in)", usePuter], ["On-device (no sign-in, big download)", useLocal], ["Offline (canned lines)", () => ready("offline")]]
    .forEach(([label, fn]) => { const b = document.createElement("button"); b.className = "chip"; b.textContent = label; b.onclick = () => { box.remove(); fn(); }; box.appendChild(b); });
  chat.appendChild(box); chat.scrollTop = chat.scrollHeight;
}
function ready(m) { mode = m; store.set("capri_mode", m); setStatus(readyText(), false); sendBtn.disabled = false; input.focus(); resetIdle(); }
function loadPuter() {
  return new Promise((res, rej) => {
    if (window.puter) return res();
    const s = document.createElement("script"); s.src = "https://js.puter.com/v2/";
    s.onload = res; s.onerror = () => rej(new Error("could not reach Puter"));
    document.head.appendChild(s);
  });
}
async function usePuter() {
  try {
    setStatus("◌ connecting to Puter...", true);
    await loadPuter();
    try { if (puter.auth && !puter.auth.isSignedIn()) await puter.auth.signIn(); } catch (e) {}
    ready("puter");
  } catch (e) {
    addMsg("CAPRI", "Puter didn’t connect (" + e.message + "). Try again, or pick another brain.", "quiet"); showChoices();
  }
}
async function useLocal() {
  try {
    if (!navigator.gpu) throw new Error("this browser has no WebGPU");
    setStatus("◌ downloading my brain (first time only)...", true); bar.style.display = "block";
    const webllm = await import("https://esm.run/@mlc-ai/web-llm");
    const ids = webllm.prebuiltAppConfig.model_list.map(m => m.model_id);
    let id = null; for (const p of LOCAL_PREFS) { id = ids.find(i => i.includes(p)); if (id) break; }
    if (!id) throw new Error("no suitable model found");
    engine = await webllm.CreateMLCEngine(id, { initProgressCallback: r => {
      barFill.style.width = Math.round((r.progress || 0) * 100) + "%"; setStatus("◌ " + (r.text || "loading").slice(0, 50), true); } });
    bar.style.display = "none"; ready("local");
  } catch (e) {
    bar.style.display = "none";
    addMsg("CAPRI", "I couldn’t wake the on-device brain here (" + e.message + "). Try Puter or offline instead.", "quiet"); showChoices();
  }
}

// ---------- replies ----------
function textOf(r) {
  const c = r && r.message ? r.message.content : r;
  if (Array.isArray(c)) return c.map(p => p.text || "").join("");
  return typeof c === "string" ? c : String(c || "");
}
async function puterReply() {
  const transcript = history.slice(-12).map(m => (m.role === "assistant" ? "Capri" : "Host") + ": " + m.content).join("\n");
  const prompt = persona() + "\n\nConversation so far:\n" + transcript + "\n\nWrite Capri’s next reply only.";
  let lastErr = "Puter gave no answer";
  for (const model of PUTER_MODELS) {
    try {
      const r = await (model ? puter.ai.chat(prompt, { model }) : puter.ai.chat(prompt));
      const t = textOf(r).trim();
      if (t) return t;
    } catch (e) { lastErr = (e && (e.message || (e.error && e.error.message))) || "Puter error"; }
  }
  throw new Error(lastErr);
}
async function localReply(out) {
  let full = "";
  const stream = await engine.chat.completions.create({
    messages: [{ role: "system", content: persona() }, ...history.slice(-12)], stream: true, max_tokens: 350, temperature: 0.85 });
  for await (const c of stream) { full += c.choices[0]?.delta?.content || ""; out.textContent = full; chat.scrollTop = chat.scrollHeight; }
  return full;
}
async function reply(text) {
  const out = addMsg("CAPRI", "");
  setStatus("◌ thinking...", true);
  const canned = learn(text);
  if (canned) {
    out.textContent = canned;
    history.push({ role: "user", content: text }, { role: "assistant", content: canned }); save();
  } else if (mode === "offline") {
    for (const [re, lines] of OFFLINE) if (re.test(text)) { out.textContent = lines[Math.floor(Math.random() * lines.length)]; break; }
  } else {
    history.push({ role: "user", content: text });
    try {
      const full = mode === "puter" ? await puterReply() : await localReply(out);
      out.textContent = full; history.push({ role: "assistant", content: full }); save();
    } catch (e) { history.pop(); out.textContent = "[LINK ERROR] " + e.message; }
  }
  setStatus(readyText(), false);
}

form.addEventListener("submit", async e => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || busy || mode === "booting") return;
  input.value = ""; addMsg("YOU", text);
  busy = true; sendBtn.disabled = true; clearTimeout(idle);
  await reply(text);
  busy = false; sendBtn.disabled = false; input.focus(); resetIdle();
});
document.querySelectorAll("#links button").forEach(b => b.onclick = () => { if (busy || sendBtn.disabled) return; input.value = b.dataset.q; form.requestSubmit(); });
$("brainBtn").onclick = () => { if (!busy) showChoices(); };

// Avatar: looping video of Capri (embedded)
const vid = $("avatarVid");
