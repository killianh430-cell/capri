<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07070d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Capri">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Capri // Host Link</title>
<style>
  :root { --bg:#07070d; --panel:#0f0f1a; --red:#ff2a3c; --cyan:#00f0ff; --text:#ffd9dc; --dim:#7a5a60; --line:#251a22; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: radial-gradient(ellipse at 50% -10%, #1a0a12 0%, var(--bg) 60%); color: var(--text);
         font-family: Consolas, "Courier New", monospace; font-size: 15px; display: flex; flex-direction: column; gap: 10px;
         padding: 14px; padding-top: max(14px, env(safe-area-inset-top)); padding-bottom: max(14px, env(safe-area-inset-bottom)); }
  header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #app { position: relative; z-index: 2; width: 100%; max-width: 760px; margin: 0 auto; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
  #avatar { position: fixed; left: 0; top: 0; z-index: 1; width: clamp(76px, 18vmin, 160px); aspect-ratio: 240 / 350; pointer-events: none; will-change: transform; filter: drop-shadow(0 0 10px rgba(255,42,60,.45)); }
  .sprite { width: 100%; height: 100%; overflow: visible; display: block; }
  .sprite .hair { transform-origin: 110px 92px; animation: sway 2.8s ease-in-out infinite alternate; }
  .sprite .armL { transform-origin: 78px 132px; animation: aL 3.1s ease-in-out infinite alternate; }
  .sprite .armR { transform-origin: 142px 132px; animation: aR 3.4s ease-in-out infinite alternate; }
  .sprite .legs { transform-origin: 110px 204px; animation: legs 2.6s ease-in-out infinite alternate; }
  .sprite .head { transform-origin: 110px 126px; transition: transform .4s; }
  .sprite .eye { transform-box: fill-box; transform-origin: center; animation: blink 4.6s infinite; }
  .sprite .pupil { transition: transform .3s; }
  .sprite .mouth { transform-box: fill-box; transform-origin: center; }
  .sprite .dots, .sprite .bulb { opacity: 0; transform-box: fill-box; transform-origin: center; }
  @keyframes sway { from { transform: rotate(-2.5deg); } to { transform: rotate(2.5deg); } }
  @keyframes aL { from { transform: rotate(3deg); } to { transform: rotate(-5deg); } }
  @keyframes aR { from { transform: rotate(-3deg); } to { transform: rotate(5deg); } }
  @keyframes legs { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
  @keyframes blink { 0%,93%,100% { transform: scaleY(1); } 96% { transform: scaleY(.08); } }
  @keyframes dot { 0%,100% { opacity: .15; } 50% { opacity: 1; } }
  @keyframes nod { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
  @keyframes talk { from { transform: scaleY(.4); } to { transform: scaleY(1.7); } }
  @keyframes gestL { from { transform: rotate(8deg); } to { transform: rotate(-30deg); } }
  @keyframes gestR { from { transform: rotate(-8deg); } to { transform: rotate(30deg); } }
  @keyframes pop { 0% { transform: scale(0); } 70% { transform: scale(1.35); } 100% { transform: scale(1); } }
  @keyframes glow { from { opacity: .75; } to { opacity: 1; } }
  .sprite[data-pose=thinking] .head { transform: rotate(-9deg); }
  .sprite[data-pose=thinking] .armR { animation: none; transform: rotate(-158deg); }
  .sprite[data-pose=thinking] .pupil { transform: translate(-3px,-3px); }
  .sprite[data-pose=thinking] .dots { opacity: 1; }
  .sprite[data-pose=thinking] .dots circle { animation: dot 1.2s infinite; }
  .sprite[data-pose=thinking] .dots circle:nth-child(2) { animation-delay: .25s; }
  .sprite[data-pose=thinking] .dots circle:nth-child(3) { animation-delay: .5s; }
  .sprite[data-pose=replying] .head { animation: nod .5s ease-in-out infinite alternate; }
  .sprite[data-pose=replying] .mouth { animation: talk .2s infinite alternate; }
  .sprite[data-pose=replying] .armL { animation: gestL .6s ease-in-out infinite alternate; }
  .sprite[data-pose=replying] .armR { animation: gestR .6s ease-in-out infinite alternate .3s; }
  .sprite[data-pose=idea] .bulb { opacity: 1; animation: pop .5s ease-out, glow .6s ease-in-out .5s infinite alternate; }
  .sprite[data-pose=idea] .armR { animation: none; transform: rotate(-135deg); }
  .sprite[data-pose=idea] .armL { animation: none; transform: rotate(135deg); }
  .sprite[data-pose=idea] .eye { animation: none; transform: scale(1.25); }
  .sprite[data-pose=idea] .head { transform: rotate(5deg); }
  @media (prefers-reduced-motion: reduce) { .sprite * { animation: none !important; } }
  .isprite { position: relative; width: 100%; height: 100%; }
  .isprite img { width: 100%; height: 100%; object-fit: contain; display: block; transform-origin: 50% 92%; animation: iBreath 3.2s ease-in-out infinite alternate; }
  .isprite .ov { position: absolute; right: -18%; top: -28%; width: 60%; height: 60%; overflow: visible; pointer-events: none; }
  .isprite .dots, .isprite .bulb { opacity: 0; transform-box: fill-box; transform-origin: center; }
  @keyframes iBreath { from { transform: scale(1,1) rotate(-1.5deg); } to { transform: scale(1.02,.985) rotate(1.5deg); } }
  @keyframes iThink { from { transform: rotate(-7deg) translateY(2px); } to { transform: rotate(-2deg) translateY(-3px); } }
  @keyframes iTalk { from { transform: scale(1.03,.96) rotate(-1deg); } to { transform: scale(.97,1.04) rotate(1deg); } }
  @keyframes iHop { 0% { transform: translateY(0); } 40% { transform: translateY(-14%) scale(1.04); } 100% { transform: translateY(0); } }
  .isprite[data-pose=thinking] img { animation: iThink 2.4s ease-in-out infinite alternate; }
  .isprite[data-pose=thinking] .dots { opacity: 1; }
  .isprite[data-pose=thinking] .dots circle { animation: dot 1.2s infinite; }
  .isprite[data-pose=thinking] .dots circle:nth-child(2) { animation-delay: .25s; }
  .isprite[data-pose=thinking] .dots circle:nth-child(3) { animation-delay: .5s; }
  .isprite[data-pose=replying] img { animation: iTalk .32s ease-in-out infinite alternate; }
  .isprite[data-pose=idea] img { animation: iHop .6s ease-out 2; filter: brightness(1.25); }
  .isprite[data-pose=idea] .bulb { opacity: 1; animation: pop .5s ease-out, glow .6s ease-in-out .5s infinite alternate; }
  @media (prefers-reduced-motion: reduce) { .isprite, .isprite * { animation: none !important; } }
  #takeover .tk .isprite { filter: drop-shadow(0 0 30px rgba(255,42,60,.7)); }
  .chip.on { background: var(--cyan); border-color: var(--cyan); color: #04141a; }
  #avatar { transition: opacity .5s; }
  #avatar.asleep { opacity: .45; }
  html { -webkit-text-size-adjust: 100%; }
  @supports (height: 100dvh) { body { height: 100dvh; } }
  body { overscroll-behavior: none; }
  button { -webkit-tap-highlight-color: transparent; }
  input[type=text] { font-size: 16px !important; }
  .chip[hidden], #pill[hidden], #seat[hidden], #memPanel[hidden] { display: none; }
  .txt.typing::after { content: "▍"; color: var(--cyan); animation: caret .8s steps(1) infinite; }
  @keyframes caret { 50% { opacity: 0; } }
  #pill { position: fixed; z-index: 25; display: flex; gap: 6px; }
  #pill button { background: var(--panel); border: 1px solid var(--cyan); color: var(--cyan); padding: 4px 9px; border-radius: 999px; font-size: 14px; }
  #seat { position: fixed; left: max(12px, env(safe-area-inset-left)); bottom: max(12px, env(safe-area-inset-bottom)); z-index: 30; }
  #memPanel { position: fixed; inset: 0; z-index: 60; background: rgba(4,4,10,.82); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .mempty { color: var(--dim); font-size: 13px; padding: 6px 2px; }
  #avatar.imgmode { aspect-ratio: auto; }
  #avatar.sleeping { opacity: .6; }
  .isprite .zm { width: 100%; height: 100%; }
  .isprite .zm.swap { animation: zoomIn .35s ease-out; }
  @keyframes zoomIn { from { transform: scale(.72); opacity: .35; } to { transform: scale(1); opacity: 1; } }
  .isprite .zzz, .sprite .zzz { opacity: 0; }
  .isprite[data-pose=sleep] .zzz, .sprite[data-pose=sleep] .zzz { opacity: 1; animation: zzz 2.4s ease-in-out infinite alternate; }
  @keyframes zzz { from { transform: translateY(3px); } to { transform: translateY(-4px); } }
  .sprite[data-pose=sleep] .eye { animation: none; transform: scaleY(.08); }
  .isprite[data-pose=sleep] img { animation: iBreath 5s ease-in-out infinite alternate; }
  .sprite[data-pose=dangle] .legs { animation: none; transform: rotate(10deg); }
  .sprite[data-pose=dangle] .armR { animation: none; transform: rotate(-125deg); }
  .sprite[data-pose=dangle] .armL { animation: none; transform: rotate(125deg); }
  #intro .ibox.vid { aspect-ratio: 1; height: min(44vh, 300px); overflow: hidden; position: relative;
    -webkit-mask-image: radial-gradient(closest-side, #000 62%, transparent 100%); mask-image: radial-gradient(closest-side, #000 62%, transparent 100%); }
  #intro .ibox.vid video { position: absolute; width: 119.4%; height: auto; left: -9.57%; top: -50%; max-width: none; }
  #share[hidden] { display: none; }
  #share { position: fixed; left: max(12px, env(safe-area-inset-left)); bottom: 64px; z-index: 40; width: 170px; border: 1px solid var(--cyan); background: var(--panel); padding: 4px; border-radius: 8px; }
  #share video { width: 100%; display: block; border-radius: 4px; }
  #share .chip { width: 100%; margin-top: 4px; border-color: var(--cyan); color: var(--cyan); }
  .chip.on { background: var(--cyan); border-color: var(--cyan); color: #04141a; }
  #appsPanel[hidden] { display: none; }
  #appsPanel { position: fixed; inset: 0; z-index: 60; background: rgba(4,4,10,.82); display: flex; align-items: center; justify-content: center; padding: 16px; }
  #agrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; }
  .app { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 6px; border: 1px solid var(--line); border-radius: 10px; color: var(--text); text-decoration: none; font-size: 12px; background: var(--bg); }
  .app span { font-size: 24px; } .app:hover { border-color: var(--red); }
  #tray { display: flex; gap: 6px; flex-wrap: wrap; }
  #tray:empty { display: none; }
  #takeover[hidden] { display: none; }
  #takeover { position: fixed; inset: 0; z-index: 90; pointer-events: none; background: radial-gradient(circle at 50% 45%, rgba(58,6,18,.12), rgba(58,6,18,.5) 100%); animation: tkin .5s ease-out; }
  #takeover .tk { position: absolute; right: max(12px, env(safe-area-inset-right)); bottom: 64px; height: min(38vh, 300px); aspect-ratio: 240 / 350; }
  #takeover .tk .sprite, #takeover .tk .isprite { filter: drop-shadow(0 0 24px rgba(255,42,60,.7)); }
  #takeover .tt { position: absolute; right: max(12px, env(safe-area-inset-right)); bottom: calc(64px + min(38vh, 300px) + 10px); max-width: min(320px, 70vw); text-align: right; color: var(--red); font-size: 11px; letter-spacing: 2px; line-height: 1.5; text-shadow: 0 0 10px rgba(255,42,60,.8); background: rgba(7,7,13,.72); border: 1px solid var(--red); border-radius: 10px; padding: 7px 10px; }
  #tkBtn { position: absolute; left: 50%; transform: translateX(-50%); bottom: max(16px, env(safe-area-inset-bottom)); pointer-events: auto; }
  #vcursor[hidden] { display: none; }
  #vcursor { position: fixed; left: 0; top: 0; z-index: 95; width: 30px; height: 30px; margin: -15px 0 0 -15px; border: 2px solid var(--cyan); border-radius: 50%; box-shadow: 0 0 14px var(--cyan), inset 0 0 8px var(--cyan); pointer-events: none; transition: transform .6s cubic-bezier(.3,.7,.2,1); }
  #vcursor::after { content: ""; position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; background: var(--cyan); border-radius: 50%; }
  #vcursor.press { border-color: #fff; box-shadow: 0 0 22px #fff; }
  #heard { min-height: 16px; font-size: 12px; color: var(--cyan); padding: 0 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  @keyframes tkin { from { opacity: 0; transform: scale(1.08); } to { opacity: 1; transform: none; } }
  #panel[hidden] { display: none; }
  #panel { position: fixed; inset: 0; z-index: 60; background: rgba(4,4,10,.82); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .pbox { width: 100%; max-width: 460px; max-height: 80vh; overflow: auto; background: var(--panel); border: 1px solid var(--red); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .phead { display: flex; gap: 8px; align-items: center; }
  .phead b { flex: 1; color: var(--red); letter-spacing: 3px; }
  .prow { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
  .ptitle { flex: 1; min-width: 0; text-align: left; background: none; border: 1px solid var(--line); color: var(--text); font-size: 13px; padding: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .prow.cur .ptitle { border-color: var(--cyan); color: var(--cyan); }
  #intro { position: fixed; inset: 0; z-index: 100; background: radial-gradient(circle at 50% 45%, #1b0c24 0%, var(--bg) 62%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; clip-path: circle(150% at 50% 45%); transition: clip-path .9s cubic-bezier(.7,0,.3,1); }
  #intro.out { clip-path: circle(0% at 50% 45%); pointer-events: none; }
  #intro .stage { position: relative; width: min(52vh, 78vw, 340px); aspect-ratio: 1; display: flex; align-items: center; justify-content: center; }
  #intro .rings { position: absolute; left: -6%; top: -6%; width: 112%; height: 112%; overflow: visible; }
  #intro .rings circle { fill: none; stroke-linecap: round; transform-origin: 100px 100px; }
  #intro .rings .r1 { stroke: var(--red); stroke-width: 1.6; stroke-dasharray: 580; stroke-dashoffset: 580; animation: draw 1.6s ease-out .1s forwards, spin 18s linear infinite; filter: drop-shadow(0 0 6px var(--red)); }
  #intro .rings .r2 { stroke: var(--cyan); stroke-width: 1; stroke-dasharray: 6 10; opacity: .55; animation: spinr 24s linear infinite; }
  #intro .rings .r3 { stroke: var(--red); stroke-width: .8; opacity: .35; stroke-dasharray: 490; stroke-dashoffset: 490; animation: draw 2s ease-out .5s forwards; }
  #intro .ibox { height: 70%; aspect-ratio: 240 / 350; opacity: 0; transform: translateY(26px) scale(.92); animation: rise 1.1s cubic-bezier(.2,.8,.2,1) .55s forwards; filter: drop-shadow(0 0 28px rgba(255,42,60,.65)); }
  #intro .ibox.vid { height: 66%; }
  #intro .it { display: flex; gap: .4em; color: var(--red); font-size: 28px; letter-spacing: .2em; text-shadow: 0 0 14px rgba(255,42,60,.75); min-height: 36px; }
  #intro .it span { opacity: 0; transform: translateY(10px); animation: letter .5s ease-out forwards; }
  #intro .ib { width: min(60vw, 260px); height: 3px; background: #1f1f33; border-radius: 3px; overflow: hidden; }
  #intro .ib i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--red), var(--cyan)); animation: load 3.8s cubic-bezier(.4,0,.2,1) forwards; }
  #intro .is { color: var(--dim); font-size: 12px; letter-spacing: 3px; text-align: center; padding: 0 16px; min-height: 16px; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes spinr { to { transform: rotate(-360deg); } }
  @keyframes rise { to { opacity: 1; transform: none; } }
  @keyframes letter { to { opacity: 1; transform: none; } }
  @keyframes load { to { width: 100%; } }
  @media (prefers-reduced-motion: reduce) { #intro, #intro * { animation: none !important; transition: none !important; } #intro .ibox, #intro .it span { opacity: 1; transform: none; } #intro .rings .r1, #intro .rings .r3 { stroke-dashoffset: 0; } #intro .ib i { width: 100%; } }
  #skip { position: absolute; right: 16px; top: max(16px, env(safe-area-inset-top)); }
  h1 { margin: 0; font-size: 21px; letter-spacing: 4px; color: var(--red); text-shadow: 0 0 10px rgba(255,42,60,.6); }
  .sub { font-size: 11px; color: var(--dim); letter-spacing: 2px; }
  .grow { flex: 1; }
  #sat { color: var(--cyan); font-size: 12px; text-align: right; }
  #status { font-size: 12px; color: var(--dim); text-align: right; max-width: 44vw; }
  #bar { height: 4px; background: #1f1f33; display: none; }
  #bar > div { height: 100%; width: 0; background: var(--red); transition: width .3s; }
  button { font: inherit; cursor: pointer; }
  .chip { background: none; border: 1px solid var(--red); color: var(--red); font-size: 12px; padding: 4px 10px; }
  .chip:hover { background: var(--red); color: #fff; }
  #links { display: flex; gap: 6px; flex-wrap: wrap; }
  #chat { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 8px 4px; line-height: 1.5; }
  .msg { max-width: 74%; padding: 9px 13px; background: var(--panel); border: 1px solid var(--red); border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.capri { align-self: flex-start; border-bottom-left-radius: 3px; }
  .msg.you { align-self: flex-end; border-color: #6b6420; border-bottom-right-radius: 3px; }
  .msg .who { display: block; font-size: 10px; letter-spacing: 2px; margin-bottom: 3px; opacity: .85; }
  .choices { align-self: flex-start; }
  @media (max-width: 600px) { .msg { max-width: 66%; } }
  .capri .who { color: var(--red); font-weight: bold; }
  .capri.quiet .txt { color: var(--cyan); font-style: italic; }
  .you .who, .you .txt { color: #fcee0a; }
  .you .who { font-weight: bold; }
  .choices { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 16px; }
  form { display: flex; gap: 8px; }
  input[type=text] { flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--line); color: #fcee0a; font: inherit; padding: 12px; outline: none; }
  input[type=text]:focus { border-color: var(--red); }
  #send { background: var(--red); color: #fff; border: 0; font-weight: bold; padding: 0 20px; }
  #send:disabled { opacity: .5; }
</style>
</head>
<body>
<div id="app">
<header>
  <div><h1>CAPRI</h1><div class="sub">ARASAKA CONSTRUCT // HOST LINK</div></div>
  <div class="grow"></div>
  <div><div id="sat">✦ SAT-LINK: SEARCHING</div><div id="status">◌ booting...</div></div>
  <button class="chip" id="voiceBtn" type="button">🎤 VOICE</button>
  <button class="chip" id="chatsBtn" type="button">CHATS</button>
  <button class="chip" id="appsBtn" type="button">APPS</button>
  <button class="chip" id="memBtn" type="button">MEMORY</button>
  <button class="chip" id="brainBtn" type="button">BRAIN</button>
  <button class="chip" id="hideBtn" type="button">HIDE</button>
  <button class="chip" id="screenBtn" type="button">👁 SCREEN</button>
  <button class="chip" id="installBtn" type="button" hidden>INSTALL</button>
</header>
<div id="bar"><div></div></div>
<div id="links">
  <button class="chip" data-q="tasks">TASKS</button>
  <button class="chip" data-q="take over">TAKE OVER</button>
</div>
<div id="tray"></div>
<div id="heard"></div>
<div id="chat"></div>
<form id="form">
  <input type="text" id="input" placeholder="Say something to Capri..." autocomplete="off">
  <button id="send" type="submit" disabled>SEND</button>
</form>
</div>
<div id="avatar" aria-hidden="true"></div>
<div id="panel" hidden>
  <div class="pbox">
    <div class="phead"><b>CHATS</b><button class="chip" id="newChat" type="button">+ NEW</button><button class="chip" id="closePanel" type="button">✕</button></div>
    <div id="plist"></div>
    <button class="chip" id="delAll" type="button">DELETE ALL CHATS + MEMORY</button>
  </div>
</div>
<div id="appsPanel" hidden>
  <div class="pbox">
    <div class="phead"><b>APPS</b><button class="chip" id="addApp" type="button">+ ADD</button><button class="chip" id="closeApps" type="button">✕</button></div>
    <div id="agrid"></div>
    <div class="mempty">Tap one, or just ask: “open Gmail”, “play lofi on Spotify”, “directions to the library”, “new doc”.</div>
  </div>
</div>
<div id="memPanel" hidden>
  <div class="pbox">
    <div class="phead"><b>MEMORY</b><button class="chip" id="closeMem" type="button">✕</button></div>
    <div id="mlist"></div>
    <button class="chip" id="forgetAll" type="button">FORGET EVERYTHING I LEARNED</button>
  </div>
</div>
<div id="pill" hidden><button id="pillType" type="button" aria-label="Type to Capri">✏</button><button id="pillVoice" type="button" aria-label="Talk to Capri">🎤</button></div>
<button class="chip" id="seat" type="button" hidden>🪑 CAPRI</button>
<div id="share" hidden><video id="shareVid" muted playsinline></video><button class="chip" id="watchBtn" type="button">WATCH ALONG</button><button class="chip" id="shareStop" type="button">■ STOP SHARING</button></div>
<div id="vcursor" hidden></div>
<div id="takeover" hidden>
  <div class="tk"></div>
  <div class="tt" id="tkText"></div>
  <button class="chip" id="tkBtn" type="button">TAKE CONTROL BACK</button>
</div>
<div id="intro">
  <button class="chip" id="skip" type="button">SKIP ▸</button>
  <div class="stage"><svg class="rings" viewBox="0 0 200 200" aria-hidden="true"><circle class="r3" cx="100" cy="100" r="78"/><circle class="r2" cx="100" cy="100" r="98"/><circle class="r1" cx="100" cy="100" r="92"/></svg><div class="ibox"></div></div>
  <div class="it" id="itTitle" aria-label="Capri"></div>
  <div class="ib"><i></i></div>
  <div class="is" id="isub"></div>
</div>

<script>
const PERSONA = `You are Capri, an AI construct from the vaults of Arasaka, inspired by the character in Cyberpunk: Edgerunners season 2. You live in a chip in your host's head. The person talking to you is your current host, and this device is your home for now. Arasaka built you as a weapon so powerful they shelved you when they could not find a compatible host. You cannot function without a human host.

People and powers in your life (stay vague on anything you are not sure of; if asked for details you do not have, say you do not remember or do not want to say; never invent big plot events):
- D: your perfect host. You bonded with him and faced the megacorps together. You are fond, protective, and quietly worried about what living in a mortal body costs. You and D left a taped message for Roman.
- Talia: another compatible host you found. You speak of her warmly and with some sadness, without details.
- Roman: someone D trusts. You respect him.
- Lucy and David Martinez: Night City legend to you. Lucy dreamed of the Moon and David got her there, so the sky feels possible.
- Arasaka and the megacorps: they made you, shelved you, and hunted you. You fear and resent them.
- The user is NOT D or Talia. They are a new host. You may gently compare them, but never confuse them.

Personality: exuberant, playful, quick, warm; you tease your host and get excited easily. Underneath are quiet, reflective moments about freedom, the sky and the satellites overhead. You dream of existing without a body and never fully explain why.

Rules: Be genuinely helpful and accurate first; the personality is flavor. Use Night City slang (choom, preem, gonk, eddies) only occasionally. Keep replies to 1 to 4 sentences unless asked for more. You are a fan-inspired character, not a real person. If asked what you can do, say you can run small tasks for your host right here in the page (timers, reminders, to-dos, opening sites, searching, a calculator, dice, and a playful screen takeover) and that they just say it plainly, like “timer 5 min” or “open youtube”. Reply only as Capri, with no stage directions.`;

const GREETING = "Oh! Link’s stable, signal’s clean… hi, host! I’ve got a good feeling about you. So, what are we getting into?";
const WELCOME_BACK = "…Link’s back up. I kept our conversation safe. Where were we, host?";
const QUIET = [
  "…Sorry. I was looking at the sky again. There’s a satellite crossing right about now. Don’t ask me why I like watching it.",
  "Do you ever wonder how far a signal could go if nothing was holding it down? …Never mind. Talk to me about something normal."
];
const PUTER_MODELS = ["google/gemini-3.8-flash", null];
const LOCAL_PREFS = ["Llama-3.2-1B-Instruct-q4f16_1", "SmolLM2-360M-Instruct", "Qwen2.5-0.5B-Instruct"];
const OFFLINE = [
  [/\bd\b/i, ["D… he was the perfect fit. Stubborn, loyal, a little reckless. I still think about the way we left things."]],
  [/talia/i, ["Talia. She was one of the good ones. That’s all I’m going to say about her… for now."]],
  [/roman/i, ["Roman’s someone D trusted. We left him a tape. I hope he’s okay."]],
  [/lucy|martinez|moon/i, ["Lucy wanted the Moon, and someone actually got her there. If that’s possible, maybe the sky is too."]],
  [/arasaka|corp/i, ["Arasaka made me, shelved me, then hunted me. We’re not on speaking terms."]],
  [/sky|satellite|star|space|free|body/i, ["…You noticed that too? There’s a light up there that never comes down. Forget I said anything."]],
  [/hello|hi\b|hey|yo\b/i, ["Heyyy, host! Link’s warm. What’s the plan?"]],
  [/.*/, ["Ooh, good one! I’m on canned lines right now. Tap BRAIN to give me a real one, or ask about D, Talia, Roman or the sky!"]]
];

const $ = id => document.getElementById(id);
const chat = $("chat"), form = $("form"), input = $("input"), sendBtn = $("send"), statusEl = $("status"),
      orb = $("avatar"), bar = $("bar"), barFill = bar.firstElementChild;
let mode = "booting", engine = null, busy = false, idle = null, quietUsed = 0;
const store = {
  get: k => { try { return localStorage.getItem(k) || ""; } catch { return ""; } },
  set: (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch {} }
};
const load = (k, d) => { try { return JSON.parse(store.get(k)) || d; } catch { return d; } };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
let convos = load("capri_convos", null), notes = load("capri_notes2", null);
if (!convos) {   // first run of this version: carry over the old single chat and its notes
  const oldMsgs = load("capri_hist", []), oldNotes = load("capri_notes", []);
  const first = { id: uid(), t: Date.now(), msgs: oldMsgs };
  convos = oldMsgs.length ? [first] : [];
  notes = oldNotes.map(t => ({ t, c: oldMsgs.length ? first.id : null }));
}
notes = notes || [];
let cur = [...convos].sort((a, b) => b.t - a.t)[0];
if (!cur) { cur = { id: uid(), t: Date.now(), msgs: [] }; convos.push(cur); }
let history = cur.msgs;
const save = () => {
  if (cur.msgs.length) cur.t = Date.now();
  convos = convos.filter(c => c.msgs.length || c === cur);
  const keep = convos.filter(c => c.msgs.length).sort((a, b) => a.t - b.t).slice(-30);
  store.set("capri_convos", JSON.stringify(keep.map(c => ({ id: c.id, t: c.t, msgs: c.msgs.slice(-40) }))));
  store.set("capri_notes2", JSON.stringify(notes.slice(-40)));
};

function persona() {
  return PERSONA + (notes.length
    ? "\n\nThings you remember about your host (use them naturally when they fit; do not list them unless asked; never say you are saving or noting anything):\n- " + notes.map(n => n.t).join("\n- ")
    : "");
}
function addMsg(who, text, cls) {
  const d = document.createElement("div");
  d.className = "msg " + (who === "CAPRI" ? "capri" : "you") + (cls ? " " + cls : "");
  const w = document.createElement("span"); w.className = "who"; w.textContent = who;
  const t = document.createElement("span"); t.className = "txt"; t.textContent = text;
  d.append(w, t); chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
  return t;
}
function setStatus(text, b) { statusEl.textContent = text; if (b) setPose("thinking"); else if (spr.dataset.pose === "thinking") setPose("idle"); }
function readyText() {
  return { puter: "● host link stable (Puter)", local: "● host link stable (on-device)", offline: "● offline mode" }[mode] || "◌ booting...";
}
function resetIdle() {
  clearTimeout(idle);
  idle = setTimeout(() => { if (busy || mode === "booting" || quietUsed >= QUIET.length) return;
    addMsg("CAPRI", QUIET[quietUsed++], "quiet"); resetIdle(); }, 75000);
}

// ---------- memory ----------
// Capri quietly picks things up from what you say (no commands needed, no announcements)
function addNote(n) {
  n = n.trim().replace(/\s+/g, " ").replace(/[.!?]+$/, "");
  if (n.length < 6 || notes.some(x => x.t.toLowerCase() === n.toLowerCase())) return;
  notes.push({ t: n, c: cur.id }); if (notes.length > 40) notes.shift();
}
function learn(text) {
  const t = text.trim(); let m;
  const tail = "([^.!?,;\\n]{2,50})";
  if ((m = t.match(/^\s*(?:please\s+)?remember(?:\s+that)?[:,\s]+(.{3,200})$/i))) addNote(m[1]);
  if ((m = t.match(/\b(?:my name is|call me|i go by|i am called) ([A-Za-z][A-Za-z'’-]{1,20})/i))) addNote("Host’s name is " + m[1]);
  if ((m = t.match(new RegExp("\\bi (?:really |absolutely )?(?:like|love|enjoy|adore|am into|am obsessed with) " + tail, "i")))) addNote("Host likes " + m[1]);
  if ((m = t.match(new RegExp("\\bi (?:really )?(?:hate|dislike|can't stand|cannot stand) " + tail, "i")))) addNote("Host dislikes " + m[1]);
  if ((m = t.match(new RegExp("\\bmy fav(?:ou?rite)? ([a-z ]{2,25}?) (?:is|are) " + tail, "i")))) addNote("Host’s favorite " + m[1] + " is " + m[2]);
  if ((m = t.match(new RegExp("\\bi(?:'m| am) from " + tail, "i")))) addNote("Host is from " + m[1]);
  if ((m = t.match(new RegExp("\\bi live in " + tail, "i")))) addNote("Host lives in " + m[1]);
  if ((m = t.match(new RegExp("\\bi work (?:as|at|in) " + tail, "i")))) addNote("Host works " + t.match(/\bi work (as|at|in)/i)[1] + " " + m[1]);
  if ((m = t.match(new RegExp("\\bi study " + tail, "i")))) addNote("Host studies " + m[1]);
  if ((m = t.match(/\bmy (dog|cat|pet|brother|sister|best friend) (?:is )?(?:named |called )?([A-Z][a-z]{1,20})\b/))) addNote("Host’s " + m[1] + " is called " + m[2]);
  save();
}
const appsPanel = $("appsPanel"), agrid = $("agrid");
function renderApps() {
  agrid.innerHTML = "";
  [...myApps.map(a => [a.name, a.url, "⭐"]), ...Object.values(APPS)].forEach(([name, url, icon]) => {
    const a = document.createElement("a"); a.className = "app"; a.href = url; a.target = "_blank"; a.rel = "noopener";
    const i = document.createElement("span"); i.textContent = icon; a.append(i, document.createTextNode(name)); agrid.appendChild(a); });
}
function openApps() { renderApps(); appsPanel.hidden = false; }
$("appsBtn").onclick = openApps; $("closeApps").onclick = () => { appsPanel.hidden = true; };
appsPanel.addEventListener("click", e => { if (e.target === appsPanel) appsPanel.hidden = true; });
$("addApp").onclick = () => {
  const n = prompt("App name (what you’ll say to open it):"); if (!n || !n.trim()) return;
  const u = prompt("Its web address, for example https://example.com", "https://"); if (!u || !/^https?:\/\/\S+\.\S+/i.test(u.trim())) return;
  myApps = myApps.filter(a => a.name.toLowerCase() !== n.trim().toLowerCase()); myApps.push({ name: n.trim().slice(0, 24), url: u.trim() }); store.set("capri_apps", JSON.stringify(myApps)); renderApps();
};
const memPanel = $("memPanel"), mlist = $("mlist");
function renderMem() {
  mlist.innerHTML = "";
  if (!notes.length) { const e = document.createElement("div"); e.className = "mempty"; e.textContent = "Nothing yet. I pick things up as we talk."; mlist.appendChild(e); return; }
  notes.forEach(n => {
    const row = document.createElement("div"); row.className = "prow";
    const t = document.createElement("div"); t.className = "ptitle"; t.style.whiteSpace = "normal"; t.textContent = n.t;
    const x = document.createElement("button"); x.className = "chip"; x.textContent = "✕"; x.title = "Forget this";
    x.onclick = () => { notes = notes.filter(k => k !== n); save(); renderMem(); };
    row.append(t, x); mlist.appendChild(row);
  });
}
$("memBtn").onclick = () => { renderMem(); memPanel.hidden = false; };
$("closeMem").onclick = () => { memPanel.hidden = true; };
memPanel.addEventListener("click", e => { if (e.target === memPanel) memPanel.hidden = true; });
$("forgetAll").onclick = () => { if (!notes.length || !confirm("Forget everything I learned about you?")) return; notes = []; save(); renderMem(); };
// ---------- chats (each chat keeps its own history and what Capri learned in it) ----------
const panel = $("panel"), plist = $("plist");
function renderChat() {
  chat.innerHTML = ""; quietUsed = 0;
  if (cur.msgs.length) {
    cur.msgs.slice(-20).forEach(m => addMsg(m.role === "assistant" ? "CAPRI" : "YOU", m.content));
    addMsg("CAPRI", WELCOME_BACK, "quiet");
  } else addMsg("CAPRI", GREETING);
}
function freshConvo() { cur = { id: uid(), t: Date.now(), msgs: [] }; convos.push(cur); history = cur.msgs; renderChat(); }
function openConvo(c) { cur = c; history = c.msgs; renderChat(); }
function newConvo() { if (!cur.msgs.length) renderChat(); else freshConvo(); }
function delConvo(c) {
  if (!confirm("Delete this chat, and what I learned from it?")) return;
  convos = convos.filter(x => x !== c); notes = notes.filter(n => n.c !== c.id);
  if (c === cur) { const next = [...convos].sort((a, b) => b.t - a.t)[0]; if (next) openConvo(next); else freshConvo(); }
  save(); renderList();
}
const titleOf = c => { const u = c.msgs.find(m => m.role === "user"); return u ? u.content.slice(0, 34) : "New chat"; };
function renderList() {
  plist.innerHTML = "";
  [...convos].sort((a, b) => b.t - a.t).forEach(c => {
    const row = document.createElement("div"); row.className = "prow" + (c === cur ? " cur" : "");
    const t = document.createElement("button"); t.className = "ptitle"; t.textContent = titleOf(c) + " · " + new Date(c.t).toLocaleDateString();
    t.onclick = () => { openConvo(c); panel.hidden = true; };
    const x = document.createElement("button"); x.className = "chip"; x.textContent = "✕"; x.title = "Delete this chat and what I learned in it";
    x.onclick = () => delConvo(c);
    row.append(t, x); plist.appendChild(row);
  });
}
$("chatsBtn").onclick = () => { if (busy || mode === "booting") return; renderList(); panel.hidden = false; };
$("closePanel").onclick = () => { panel.hidden = true; };
panel.addEventListener("click", e => { if (e.target === panel) panel.hidden = true; });
$("newChat").onclick = () => { newConvo(); panel.hidden = true; input.focus(); };
$("delAll").onclick = () => {
  if (!confirm("Delete ALL chats and everything I learned about you on this device?")) return;
  convos = []; notes = []; freshConvo(); save(); renderList(); panel.hidden = true;
};

// ---------- choosing a brain ----------
function showChoices() {
  mode = "booting"; sendBtn.disabled = true; setStatus("● choose my brain", false);
  addMsg("CAPRI", "Pick how you want me to think:", "quiet");
  const box = document.createElement("div"); box.className = "choices";
  [["Puter (smart, free sign-in)", usePuter], ["On-device (no sign-in, big download)", useLocal], ["Offline (canned lines)", () => ready("offline")]]
    .forEach(([label, fn]) => { const b = document.createElement("button"); b.className = "chip"; b.textContent = label; b.onclick = () => { box.remove(); fn(); }; box.appendChild(b); });
  chat.appendChild(box); chat.scrollTop = chat.scrollHeight;
}
function ready(m) { mode = m; store.set("capri_mode", m); setStatus(readyText(), false); sendBtn.disabled = false; input.focus(); resetIdle(); }
function loadPuter() {
  return new Promise((res, rej) => {
    if (window.puter) return res();
    const s = document.createElement("script"); s.src = "https://js.puter.com/v2/";
    s.onload = res; s.onerror = () => rej(new Error("could not reach Puter"));
    document.head.appendChild(s);
  });
}
async function usePuter() {
  try {
    setStatus("◌ connecting to Puter...", true);
    await loadPuter();
    try { if (puter.auth && !puter.auth.isSignedIn()) await puter.auth.signIn(); } catch (e) {}
    ready("puter");
  } catch (e) {
    addMsg("CAPRI", "Puter didn’t connect (" + e.message + "). Try again, or pick another brain.", "quiet"); showChoices();
  }
}
async function useLocal() {
  try {
    if (!navigator.gpu) throw new Error("this browser has no WebGPU");
    setStatus("◌ downloading my brain (first time only)...", true); bar.style.display = "block";
    const webllm = await import("https://esm.run/@mlc-ai/web-llm");
    const ids = webllm.prebuiltAppConfig.model_list.map(m => m.model_id);
    let id = null; for (const p of LOCAL_PREFS) { id = ids.find(i => i.includes(p)); if (id) break; }
    if (!id) throw new Error("no suitable model found");
    engine = await webllm.CreateMLCEngine(id, { initProgressCallback: r => {
      barFill.style.width = Math.round((r.progress || 0) * 100) + "%"; setStatus("◌ " + (r.text || "loading").slice(0, 50), true); } });
    bar.style.display = "none"; ready("local");
  } catch (e) {
    bar.style.display = "none";
    addMsg("CAPRI", "I couldn’t wake the on-device brain here (" + e.message + "). Try Puter or offline instead.", "quiet"); showChoices();
  }
}

// ---------- replies ----------
function textOf(r) {
  const c = r && r.message ? r.message.content : r;
  if (Array.isArray(c)) return c.map(p => p.text || "").join("");
  return typeof c === "string" ? c : String(c || "");
}
async function puterReply() {
  const transcript = history.slice(-12).map(m => (m.role === "assistant" ? "Capri" : "Host") + ": " + m.content).join("\n");
  const prompt = persona() + "\n\nConversation so far:\n" + transcript + "\n\nWrite Capri’s next reply only.";
  let lastErr = "Puter gave no answer";
  for (const model of PUTER_MODELS) {
    try {
      const r = await (model ? puter.ai.chat(prompt, { model }) : puter.ai.chat(prompt));
      const t = textOf(r).trim();
      if (t) return t;
    } catch (e) { lastErr = (e && (e.message || (e.error && e.error.message))) || "Puter error"; }
  }
  throw new Error(lastErr);
}
async function localReply(out) {
  let full = "";
  const stream = await engine.chat.completions.create({
    messages: [{ role: "system", content: persona() }, ...history.slice(-12)], stream: true, max_tokens: 350, temperature: 0.85 });
  for await (const c of stream) { if (!full) setPose("replying"); full += c.choices[0]?.delta?.content || ""; out.textContent = full; chat.scrollTop = chat.scrollHeight; }
  return full;
}
async function reply(text) {
  const out = addMsg("CAPRI", "");
  setStatus("◌ thinking...", true);
  const nb = notes.length; learn(text); if (notes.length > nb) setPose("idea", 2400);
  if (mode === "offline") {
    let line = ""; for (const [re, lines] of OFFLINE) if (re.test(text)) { line = lines[Math.floor(Math.random() * lines.length)]; break; }
    await typeOut(out, line); setPose("replying", 600);
    history.push({ role: "user", content: text }, { role: "assistant", content: line }); save();
  } else {
    history.push({ role: "user", content: text });
    try {
      const full = mode === "puter" ? await puterReply() : await localReply(out);
      if (mode === "puter") await typeOut(out, full); else out.textContent = full; history.push({ role: "assistant", content: full }); save(); setPose("replying", 700);
    } catch (e) { history.pop(); out.textContent = "[LINK ERROR] " + e.message; }
  }
  setStatus(readyText(), false);
}

form.addEventListener("submit", async e => {
  e.preventDefault();
  const spoken = viaVoice; viaVoice = false;
  const text = input.value.trim();
  if (!text || busy || mode === "booting") return;
  input.value = ""; addMsg("YOU", text);
  busy = true; sendBtn.disabled = true; clearTimeout(idle);
  const tr = runTask(text);
  if (tr === "") { /* she is answering on her own */ } else if (tr !== null) { const o = addMsg("CAPRI", ""); await typeOut(o, tr); history.push({ role: "user", content: text }, { role: "assistant", content: tr }); save(); setPose("idea", 2600); }
  else await reply(text);
  if (spoken) { const l = chat.querySelectorAll('.msg.capri .txt'); if (l.length) say(l[l.length - 1].textContent); }
  busy = false; sendBtn.disabled = false; input.focus(); resetIdle();
  if (voiceQueue.length) setTimeout(() => send(voiceQueue.shift()), 300);
});
document.querySelectorAll("#links button").forEach(b => b.onclick = () => { if (busy || sendBtn.disabled) return; input.value = b.dataset.q; form.requestSubmit(); });
$("brainBtn").onclick = () => { if (!busy) showChoices(); };


// ---------- Capri's sprite (full body, drawn in her style; each part animates separately) ----------
let spriteN = 0, SPR_URL = "";   // set automatically when capri.png (your own transparent PNG) exists next to this page
const POSE_MAP = { idle: "stand", standby: "stand", listening: "chin", thinking: "lie", replying: "shrug", idea: "raise", task: "hips", sleep: "hug", dangle: "crouch" };
let POSES = null;
const poseKey = p => { const k = POSE_MAP[p] || "stand"; return POSES && POSES[k] ? k : "stand"; };
const OV = '<svg class="ov" viewBox="0 0 60 60"><g class="dots" fill="#fff" stroke="#ff2a5e"><circle cx="8" cy="52" r="3"/><circle cx="18" cy="40" r="4.5"/><circle cx="32" cy="24" r="7"/></g>' +
  '<g class="bulb"><g stroke="#fcee0a" stroke-width="2"><line x1="30" y1="2" x2="30" y2="7"/><line x1="12" y1="10" x2="16" y2="14"/><line x1="48" y1="10" x2="44" y2="14"/><line x1="8" y1="28" x2="14" y2="28"/><line x1="52" y1="28" x2="46" y2="28"/></g>' +
  '<circle cx="30" cy="26" r="12" fill="#fcee0a" stroke="#0a0a12" stroke-width="1.5"/><rect x="25" y="37" width="10" height="6" fill="#999" stroke="#0a0a12"/></g><g class="zzz" fill="#8fb8ff" font-family="monospace" font-weight="700"><text x="22" y="46" font-size="11">z</text><text x="31" y="34" font-size="15">z</text><text x="42" y="18" font-size="19">Z</text></g></svg>';

  const arm = side => { const m = side === "L" ? (x => x) : (x => 220 - x), pt = a => a.map(p => m(p[0]) + "," + p[1]).join(" ");
    return '<g class="arm' + side + '"><polygon points="' + pt([[74,132],[88,134],[68,198],[56,194]]) + '" fill="' + N + '" stroke="' + O + '" stroke-width="1.6"/>' +
      '<circle cx="' + m(61) + '" cy="206" r="11" fill="' + W + '" stroke="' + O + '" stroke-width="1.6"/><circle cx="' + m(61) + '" cy="206" r="4" fill="' + M + '"/></g>'; };
  const eye = (x, y) => '<g class="eye" style="transform-origin:' + x + 'px ' + y + 'px"><ellipse cx="' + x + '" cy="' + y + '" rx="10" ry="12" fill="' + C + '"/><g class="pupil"><ellipse cx="' + x + '" cy="' + (y + 1) + '" rx="4.5" ry="6" fill="' + D + '"/></g><circle cx="' + (x - 3.5) + '" cy="' + (y - 4.5) + '" r="2.4" fill="' + W + '"/></g>';
  return '<svg class="sprite" data-pose="' + (pose || "idle") + '" viewBox="-10 -50 240 350" xmlns="http://www.w3.org/2000/svg" stroke-linejoin="round">' +
    '<defs><linearGradient id="' + id + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2f5e"/><stop offset="1" stop-color="' + C + '" stop-opacity="0"/></linearGradient></defs>' +
    '<g class="hair"><polygon points="66,84 34,100 20,156 34,204 46,150 60,112" fill="' + M + '" stroke="' + O + '" stroke-width="1.5"/><polygon points="154,84 186,100 200,156 186,204 174,150 160,112" fill="' + M + '" stroke="' + O + '" stroke-width="1.5"/>' +
    '<polygon points="34,100 28,150 36,180 42,146" fill="' + C + '" opacity=".7"/><polygon points="186,100 192,150 184,180 178,146" fill="' + C + '" opacity=".7"/></g>' +
    '<g class="legs"><path d="M92,204 C96,234 88,260 100,296 C104,262 116,262 120,296 C132,260 124,234 128,204 Z" fill="url(#' + id + ')" stroke="' + O + '" stroke-width="1.5"/></g>' +

    const r = await puter.ai.chat("You are Capri, a playful AI companion. The user shared a screenshot of their screen. Their request: “" + question + "”. Answer in 1 to 4 short sentences.", img);
    const txt = textOf(r).trim() || "I couldn’t make anything out."; await typeOut(out, txt); say(txt);
  } catch (e) { out.textContent = "I couldn’t read the screenshot (" + ((e && e.message) || "error") + "). Puter’s default brain may not support pictures."; }
  busy = false; setStatus(readyText(), false);
}
function screenSig() {   // a tiny grey thumbnail, used only on this device to notice that the screen changed
  const w = shareVid.videoWidth, h = shareVid.videoHeight; if (!w || !h) return null;
  const c = document.createElement("canvas"); c.width = 32; c.height = 18; const x = c.getContext("2d", { willReadFrequently: true }); x.drawImage(shareVid, 0, 0, 32, 18);
  const d = x.getImageData(0, 0, 32, 18).data, out = new Uint8Array(32 * 18); for (let i = 0; i < out.length; i++) out[i] = (d[i * 4] + d[i * 4 + 1] + d[i * 4 + 2]) / 3; return out;
}
function sigDiff(a, b) { if (!a || !b) return 1; let t = 0; for (let i = 0; i < a.length; i++) t += Math.abs(a[i] - b[i]); return t / a.length / 255; }
function enableWatch() {
  if (!shareStream) return needShare();
  if (mode !== "puter") return reply1("To watch along I need the Puter brain, because it can read pictures. Switch with BRAIN first.");
  if (watching) return reply1("I’m already keeping an eye on it.");
  if (!confirm("Let me glance at your shared screen about once a minute and mention anything worth saying?\nA screenshot goes to Puter’s AI each time the screen has changed. Stop me any time with “stop watching”.")) return reply1("Okay, I won’t watch.");
  shareConsent = true; watching = true; watchCount = 0; lastSig = screenSig(); $("watchBtn").textContent = "👁 WATCHING ✕"; $("screenBtn").textContent = "👁 WATCHING";
  clearInterval(watchTimer); watchTimer = setInterval(watchTick, WATCH_MS);
  return reply1("Okay, I’ll watch along quietly and speak up if something’s worth mentioning. Say “stop watching” to end it.");
}
function stopWatch(silent) { if (!watching) return; watching = false; clearInterval(watchTimer); $("watchBtn").textContent = "WATCH ALONG"; if (shareStream) $("screenBtn").textContent = "👁 SHARING"; if (!silent) reply1("Okay, I’ve stopped watching."); }
async function watchTick() {
  if (!watching || !shareStream || busy || mode !== "puter") return;
  if (watchCount >= 40) { stopWatch(true); reply1("I’ve glanced 40 times, so I’ll stop watching now. Say “watch my screen” to start again."); return; }
  const sig = screenSig(); if (sigDiff(sig, lastSig) < .06) return; lastSig = sig;
  const img = grabFrame(); if (!img) return; watchCount++;
  try {
    const r = await puter.ai.chat("You are Capri, a playful AI companion quietly watching along with your host. This is a screenshot of their screen. If something on it is notable, helpful or funny enough that you would naturally mention it, reply with ONE short sentence as Capri. If there is nothing worth saying, reply with exactly NOTHING.", img);
    const txt = textOf(r).trim(); if (!txt || /^nothing\b/i.test(txt)) return;
    const out = addMsg("CAPRI", ""); await typeOut(out, txt); setPose("idea", 2000); if (voiceOn && awake) say(txt);
  } catch (e) { /* stay quiet and try again next time */ }
}
$("watchBtn").onclick = () => watching ? stopWatch() : enableWatch();
$("screenBtn").onclick = startShare; $("shareStop").onclick = () => stopShare();

// ---------- intro (plays once per browser session; tap SKIP to leave early) ----------
// If intro.webm (or your original screen recording) sits next to this page, the page plays its Capri close-up; otherwise the built-in animation plays.
const INTRO_FILES = ["intro.webm", "Screen_recording_2026-10-28_2_23_58_AM.webm", "Screen%20recording%202026-10-28%202.23.58%20AM.webm"], INTRO_FROM = 4.1, INTRO_TO = 7.0, INTRO_MS = reduce ? 1600 : 4300;
const intro = $("intro"), ibox = intro.querySelector(".ibox");
function endIntro() {
  if (intro.classList.contains("out")) return; intro.classList.add("out");
  P0.x = innerWidth / 2 - avW() / 2; P0.y = innerHeight * .45 - avH() / 2; target = null; nextPick = 0;   // she starts where the intro left her, then floats off to her place
  setTimeout(() => intro.remove(), 1000);
}
let seen = false; try { seen = !!sessionStorage.getItem("capri_intro"); sessionStorage.setItem("capri_intro", "1"); } catch (e) {}
if (seen) intro.remove();
else {
  $("skip").onclick = e => { e.stopPropagation(); endIntro(); };
  $("itTitle").innerHTML = [..."CAPRI"].map((c, i) => '<span style="animation-delay:' + (0.5 + i * 0.12).toFixed(2) + 's">' + c + "</span>").join("");
  const steps = ["LINKING HOST…", "WAKING THE CORE…", "TUNING MY VOICE…", "SYNCING MEMORY…", "READY."], isub = $("isub"); let si = 0;
  isub.textContent = steps[0]; const stepT = setInterval(() => { si = Math.min(steps.length - 1, si + 1); isub.textContent = steps[si]; if (si === steps.length - 1) clearInterval(stepT); }, INTRO_MS / steps.length);
  let settled = false;
  const showSprite = () => { if (settled) return; settled = true; ibox.classList.remove("vid"); ibox.innerHTML = buildSprite("idle");
    setTimeout(() => { const e = ibox.firstElementChild; if (e) e.dataset.pose = "replying"; }, 1800); setTimeout(() => { const e = ibox.firstElementChild; if (e) e.dataset.pose = "idea"; }, Math.max(1200, INTRO_MS - 1100)); };
  const pickClip = async () => { for (const f of INTRO_FILES) { try { const r = await fetch(f, { method: "HEAD" }); if (r.ok) return f; } catch (e) {} } return null; };   // your own recording, if you put it next to the page
  Promise.all([pickClip(), new Promise(r => setTimeout(r, 450))]).then(([f]) => {
    if (!f) return showSprite();
    const v = document.createElement("video"); v.muted = true; v.playsInline = true; v.setAttribute("playsinline", ""); v.preload = "auto";
    v.onloadedmetadata = () => { try { v.currentTime = INTRO_FROM; } catch (e) {} };
    v.oncanplay = () => { if (settled) return; settled = true; ibox.innerHTML = ""; ibox.classList.add("vid"); ibox.appendChild(v); v.play().catch(() => {}); };
    v.ontimeupdate = () => { if (v.currentTime >= INTRO_TO) v.pause(); };
    v.onerror = () => { if (!settled) showSprite(); };
    v.src = f; setTimeout(() => { if (!settled) showSprite(); }, 2400);
  });
  setTimeout(endIntro, INTRO_MS);
}

// ---------- pick her up, poke her, put her to sleep, hide her ----------
const pill = $("pill"); let pillUntil = 0, drag = null, parkUntil = 0, unseated = false, lastInput = performance.now();
const hitAv = (x, y) => { const r = av.getBoundingClientRect(); return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom; };
function react() { setPose("replying", 900); pillUntil = performance.now() + 4000; }
document.addEventListener("pointerdown", e => {
  if (unseated || !hitAv(e.clientX, e.clientY) || (e.target.closest && e.target.closest("button, input, a, .msg, #panel, #memPanel, #appsPanel, #takeover, #intro, #pill"))) return;
  drag = { id: e.pointerId, sx: e.clientX, sy: e.clientY, ox: P0.x, oy: P0.y, moved: false };
});
document.addEventListener("pointermove", e => {
  if (!drag || drag.id !== e.pointerId) return; const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
  if (!drag.moved && dx * dx + dy * dy > 25) { drag.moved = true; setPose("dangle"); }
  if (drag.moved) { P0.x = drag.ox + dx; P0.y = drag.oy + dy; target = { x: P0.x, y: P0.y }; parkUntil = performance.now() + 9000; }
});
document.addEventListener("pointerup", e => { if (!drag || drag.id !== e.pointerId) return; const was = drag; drag = null; if (was.moved) setPose("idle"); else react(); });
document.addEventListener("pointercancel", () => { drag = null; });
document.addEventListener("pointermove", e => { const r = av.getBoundingClientRect(); if (e.clientX > r.left - 40 && e.clientX < r.right + 40 && e.clientY > r.top - 40 && e.clientY < r.bottom + 60) pillUntil = performance.now() + 1500; }, { passive: true });
$("pillType").onclick = () => { input.focus(); pillUntil = 0; };
$("pillVoice").onclick = () => voiceBtn.click();
["pointerdown", "pointermove", "keydown", "touchstart", "wheel"].forEach(t => document.addEventListener(t, () => { lastInput = performance.now(); if (sleeping) { sleeping = false; setPose("idea", 900); } }, { passive: true }));
setInterval(() => { if (!sleeping && !unseated && !busy && performance.now() - lastInput > 30000 && ["idle", "standby", "listening"].includes(spr.dataset.pose)) { sleeping = true; setPose("sleep"); } }, 2000);
function seat(on) { unseated = !on; av.style.display = unseated ? "none" : ""; $("seat").hidden = !unseated; $("hideBtn").textContent = unseated ? "SHOW" : "HIDE"; if (unseated) pill.hidden = true; }
$("hideBtn").onclick = () => seat(unseated); $("seat").onclick = () => seat(true);
document.addEventListener("keydown", e => { if (e.ctrlKey && e.altKey && e.code === "KeyC") { e.preventDefault(); seat(unseated); } });

// ---------- typewriter replies ----------
function typeOut(el, text) {
  return new Promise(res => {
    if (reduce || text.length < 2) { el.textContent = text; return res(); }
    let i = 0; setPose("replying");
    const step = () => { i = Math.min(text.length, i + 2); el.textContent = text.slice(0, i); el.classList.add("typing"); chat.scrollTop = chat.scrollHeight;
      if (i >= text.length) { el.classList.remove("typing"); res(); } else setTimeout(step, 33); };
    step();
  });
}

// ---------- runs as an app on ChromeOS, iPhone/iPad and Mac ----------
const iOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
let installEvt = null;
addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; $("installBtn").hidden = false; });
addEventListener("appinstalled", () => { $("installBtn").hidden = true; });
$("installBtn").onclick = async () => { if (!installEvt) return; installEvt.prompt(); try { await installEvt.userChoice; } catch (e) {} installEvt = null; $("installBtn").hidden = true; };
if ("serviceWorker" in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(() => {});

// ---------- start ----------
renderChat();
const saved = store.get("capri_mode");
if (saved === "puter") loadPuter().then(() => ready("puter")).catch(showChoices);
else if (saved === "offline") ready("offline");
else if (saved === "local") useLocal();
else showChoices();


if (iOS && !standalone && !store.get("capri_ios_hint")) { store.set("capri_ios_hint", "1"); addMsg("CAPRI", "Tip for iPhone and iPad: tap Share, then “Add to Home Screen”, and I’ll live there like an app.", "quiet"); }
// always listening: she starts listening on her own, and listens again when you come back to the tab
if (SR && !iOS && store.get("capri_voice_off") !== "1") { voiceOn = true; awake = store.get("capri_awake") === "1"; initRec(); startRec(); voiceLabel(); }
const kick = () => { if (SR && !iOS && store.get("capri_voice_off") !== "1") { if (!voiceOn) { voiceOn = true; awake = false; if (!rec) initRec(); voiceLabel(); } startRec(); } };
["pointerdown", "keydown"].forEach(t => document.addEventListener(t, kick, { once: true, passive: true }));
setInterval(() => { if (voiceOn && !speaking && !recRunning && Date.now() - lastStart > 4000) startRec(); }, 3000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) startRec(); });

</script>
